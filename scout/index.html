const FILES = {
 "app.py": "\"\"\"Five-league transfer profit explorer. Read-only view over the spells table.\n\nBilingual: every string comes from scout.i18n, and everything the code\ncompares or stores stays a stable code. See that module for why.\n\"\"\"\nimport math\n\nimport altair as alt\nimport numpy as np\nimport pandas as pd\nimport streamlit as st\n\nfrom scout.constants import LEAGUES\nfrom scout.i18n import DEFAULT_LANGUAGE, LANGUAGES, labels, translator\nfrom scout.model.chart import (\n    aggregate_scatter_bins,\n    build_reference_lines,\n    parse_number_list,\n    symlog_ticks,\n    horizontal as ref_horizontal,\n    linear as ref_linear,\n    vertical as ref_vertical,\n)\nfrom scout.export import DEFAULT_EXPORT_DIR as EXPORT_DIR\nfrom scout.model.metrics import add_perf_metrics\nfrom scout.store.db import DEFAULT_DB, load_table\nfrom scout.store.demo import demo_tables\nfrom scout.store.formats import SUFFIXES\nfrom scout.store.source import (\n    OPTIONAL_TABLES,\n    REQUIRED_COLUMNS,\n    UploadError,\n    describe_accepted,\n    describe_schema,\n    read_upload,\n)\n\n# Read the language before the first Streamlit command so the browser tab\n# title can use it. The sidebar radio below owns this session_state key; on\n# the first run it is absent and the default applies.\nLANG = st.session_state.get(\"lang\", DEFAULT_LANGUAGE)\nt = translator(LANG)\n\nst.set_page_config(page_title=t(\"page.title\"), layout=\"wide\")\n\n# Fees are stored in euros but read badly at that scale - a €116,600,000 cell is\n# just a wall of zeros. Everything on screen is divided into 10k euros, so that\n# fee shows as 11,660. Storage stays in euros; this is display only.\nWAN = 10_000\nMONEY_COLUMNS = (\n    \"buy_fee\", \"sell_fee\", \"buy_market_value\", \"sell_market_value\", \"profit\",\n    \"buy_value_gap\", \"sell_value_gap\",\n)\n\nAXIS_COLUMNS = [\n    \"buy_fee\", \"sell_fee\", \"buy_market_value\", \"sell_market_value\",\n    \"buy_value_gap\", \"sell_value_gap\", \"profit\", \"roi_mult\", \"hold_years\",\n    \"buy_age\", \"sell_age\", \"age_diff\",\n]\n\n# Axes for the money-x-performance tab. One row per spell, so the money side is\n# the same spell vocabulary as AXIS_COLUMNS while the performance side is the\n# spell's on-pitch totals from spell_performance (see SPELL_STAT_SUMS in\n# pipeline_perf for how each total is built).\nCOMBO_AXIS_COLUMNS = [\n    \"buy_fee\", \"sell_fee\", \"profit\", \"roi_mult\", \"buy_value_gap\",\n    \"sell_value_gap\", \"hold_years\", \"cost_per_goal\", \"goals_per_90\",\n    \"tm_apps\", \"tm_goals\", \"tm_assists\", \"tm_minutes\", \"tm_yellow\", \"tm_red\",\n    \"seasons\",\n    \"fb_xg\", \"fb_npxg\", \"fb_xag\", \"fb_shots\", \"fb_shots_on_target\",\n    \"fb_key_passes\", \"fb_prog_passes\", \"fb_prog_carries\", \"fb_prog_receptions\",\n    \"fb_touches\", \"fb_dribbles_won\", \"fb_carry_distance\", \"fb_tackles\",\n    \"fb_tackles_won\", \"fb_interceptions\", \"fb_blocks\", \"fb_clearances\",\n    \"fb_aerials_won\", \"fb_fouls\", \"fb_fouled\", \"fb_recoveries\", \"fb_saves\",\n    \"fb_goals_against\", \"fb_clean_sheets\",\n    \"bl_distance_km\", \"bl_distance_per90\", \"bl_sprints\", \"bl_intensive_runs\",\n    \"bl_top_speed_kmh\",\n]\n\nAXIS_OPTIONS = labels(AXIS_COLUMNS, LANG)\nCOMBO_AXIS_OPTIONS = labels(COMBO_AXIS_COLUMNS, LANG)\n\nCOMBO_MONEY_COLUMNS = (\n    \"buy_fee\", \"sell_fee\", \"profit\", \"buy_value_gap\", \"sell_value_gap\",\n    \"cost_per_goal\",\n)\n\nCOMBO_AXIS_NOTES = {\n    **{c: t(\"note.fb\") for c in COMBO_AXIS_COLUMNS if c.startswith(\"fb_\")},\n    **{c: t(\"note.bl\") for c in COMBO_AXIS_COLUMNS if c.startswith(\"bl_\")},\n    \"cost_per_goal\": t(\"note.cost_per_goal\"),\n    \"goals_per_90\": t(\"note.goals_per_90\"),\n}\n\nCOMBO_BIN_SETTINGS = {\n    \"buy_fee\": (100.0, 50.0), \"sell_fee\": (100.0, 50.0), \"profit\": (100.0, 50.0),\n    \"buy_value_gap\": (100.0, 50.0), \"sell_value_gap\": (100.0, 50.0),\n    \"roi_mult\": (0.5, 0.1), \"hold_years\": (1.0, 1.0),\n    \"cost_per_goal\": (100.0, 50.0), \"goals_per_90\": (0.1, 0.05),\n    \"tm_apps\": (20.0, 10.0), \"tm_goals\": (5.0, 1.0), \"tm_assists\": (5.0, 1.0),\n    \"tm_minutes\": (900.0, 90.0), \"tm_yellow\": (5.0, 1.0), \"tm_red\": (1.0, 1.0),\n    \"seasons\": (1.0, 1.0),\n    \"fb_xg\": (5.0, 1.0), \"fb_npxg\": (5.0, 1.0), \"fb_xag\": (5.0, 1.0),\n    \"fb_shots\": (20.0, 10.0), \"fb_shots_on_target\": (10.0, 5.0),\n    \"fb_key_passes\": (10.0, 5.0),\n    \"fb_prog_passes\": (50.0, 25.0), \"fb_prog_carries\": (50.0, 25.0),\n    \"fb_prog_receptions\": (50.0, 25.0),\n    \"fb_touches\": (500.0, 100.0), \"fb_dribbles_won\": (10.0, 5.0),\n    \"fb_carry_distance\": (2000.0, 500.0),\n    \"fb_tackles\": (20.0, 10.0), \"fb_tackles_won\": (10.0, 5.0),\n    \"fb_interceptions\": (10.0, 5.0), \"fb_blocks\": (10.0, 5.0),\n    \"fb_clearances\": (20.0, 10.0), \"fb_aerials_won\": (20.0, 10.0),\n    \"fb_fouls\": (10.0, 5.0), \"fb_fouled\": (10.0, 5.0),\n    \"fb_recoveries\": (50.0, 25.0),\n    \"fb_saves\": (20.0, 10.0), \"fb_goals_against\": (10.0, 5.0),\n    \"fb_clean_sheets\": (5.0, 1.0),\n    \"bl_distance_km\": (100.0, 50.0), \"bl_distance_per90\": (0.5, 0.25),\n    \"bl_sprints\": (200.0, 100.0),\n    \"bl_intensive_runs\": (500.0, 250.0), \"bl_top_speed_kmh\": (1.0, 0.5),\n}\n\nBIN_SETTINGS = {\n    \"buy_fee\": (100.0, 50.0),\n    \"sell_fee\": (100.0, 50.0),\n    \"buy_market_value\": (100.0, 50.0),\n    \"sell_market_value\": (100.0, 50.0),\n    \"buy_value_gap\": (100.0, 50.0),\n    \"sell_value_gap\": (100.0, 50.0),\n    \"profit\": (100.0, 50.0),\n    \"roi_mult\": (0.5, 0.1),\n    \"hold_years\": (1.0, 1.0),\n    \"buy_age\": (1.0, 1.0),\n    \"sell_age\": (1.0, 1.0),\n    \"age_diff\": (1.0, 1.0),\n}\n\n# Codes, not labels: these are compared against, so translating them in place\n# would break every branch and filter the moment the language changed.\nERROR_BAR_OPTIONS = {\n    \"std\": t(\"errbar.std\"), \"sem\": t(\"errbar.sem\"), \"ci95\": t(\"errbar.ci95\"),\n}\nSCALE_OPTIONS = {\n    \"linear\": t(\"scale.linear\"), \"log\": t(\"scale.log\"), \"symlog\": t(\"scale.symlog\"),\n}\nCHART_TYPES = {\"scatter\": t(\"chart.scatter\"), \"bar\": t(\"chart.bar\")}\nSCATTER_MODES = {\"raw\": t(\"chart.mode_raw\"), \"binned\": t(\"chart.mode_binned\")}\n\n# A realized spell can still have no sell_fee: \"-\" means the contract expired or\n# the player retired, \"?\" means the fee was never published. Neither is zero, so\n# profit stays null - the outcome column says which, to keep the blank readable.\n# \"unknown_exit\" is a player re-signed for a club we never saw them leave: the\n# buy side is real, only the exit is missing, which is a different thing from a\n# null sell_type (an unknown *start*), so the two must not both read as unknown.\nOUTCOME_CODES = [\n    \"transfer\", \"free\", \"no_fee\", \"undisclosed\", \"still_here\", \"unknown_exit\",\n    \"unknown\",\n]\n\n# league is null for clubs outside the covered big five (they appear only as\n# counterparties); given an explicit code so the filter can include or exclude\n# them deliberately.\nOTHER_LEAGUE = \"__other__\"\n\n# Plain log silently drops every non-positive value, which on profit means\n# hiding the losses - 65% of the rows, and the half anyone actually wants to\n# inspect. Symlog is linear inside +/-constant and logarithmic beyond it, so\n# the sign survives and zero is representable.\nSYMLOG_DEFAULT_CONSTANT = 1.0\n\nREFERENCE_PRESETS = {\n    \"y = 0\": lambda: ref_horizontal(0),\n    \"x = 0\": lambda: ref_vertical(0),\n    \"y = x\": lambda: ref_linear(1, 0),\n    \"y = -x\": lambda: ref_linear(-1, 0),\n}\n\nREFERENCE_COLOR = \"#E9B949\"\n\n\ndef league_label(code):\n    return t(\"league.other\") if code == OTHER_LEAGUE else code\n\n\n# Widgets whose *displayed value* is translated - a multiselect's chips, a\n# selectbox's current choice - need these three helpers.\n#\n# Streamlit seeds a widget's option labels on the frontend the first time a key\n# appears. Relabelling the same key on a later run updates the dropdown but\n# leaves the already-selected chips reading in the old language, which is what\n# an English page showing 转会卖出 looks like. Giving the key a language suffix\n# forces a genuinely new widget; `sticky`/`remember` carry the chosen value\n# across the switch so the filter itself does not reset.\n#\n# Widgets whose value is not translated (text, checkboxes, sliders) keep a\n# plain key: their labels change harmlessly and their state is already safe.\ndef keyed(name):\n    return f\"{name}__{LANG}\"\n\n\ndef sticky(name, default):\n    return st.session_state.get(f\"_sticky_{name}\", default)\n\n\ndef remember(name, value):\n    st.session_state[f\"_sticky_{name}\"] = value\n    return value\n\n\ndef sticky_index(name, options, default):\n    \"\"\"Position of the remembered choice, falling back when it is gone.\n\n    The money-x-performance tab offers only the columns the stored data\n    actually has, so a remembered axis can vanish between builds.\n    \"\"\"\n    options = list(options)\n    value = sticky(name, default)\n    return options.index(value if value in options else default)\n\n\ndef scale_picker(label, key):\n    \"\"\"Pick an axis scale, plus the linear-region width when it is symlog.\"\"\"\n    scale_type = remember(key, st.selectbox(\n        label,\n        list(SCALE_OPTIONS),\n        index=sticky_index(key, SCALE_OPTIONS, \"linear\"),\n        format_func=SCALE_OPTIONS.get,\n        key=keyed(key),\n    ))\n    constant = SYMLOG_DEFAULT_CONSTANT\n    if scale_type == \"symlog\":\n        constant = st.number_input(\n            t(\"scale.constant\"),\n            min_value=0.001,\n            value=SYMLOG_DEFAULT_CONSTANT,\n            step=0.5,\n            key=f\"{key}_constant\",\n            help=t(\"scale.constant_help\"),\n        )\n    return {\"type\": scale_type, \"constant\": float(constant)}\n\n\ndef axis_for(scale, series, title):\n    \"\"\"Axis spec, with explicit decade ticks when the scale is symlog.\n\n    Vega's own symlog ticks are spaced linearly over the raw domain, which\n    leaves the compressed inner decades - where most of the points are -\n    without a single gridline. See chart.symlog_ticks.\n    \"\"\"\n    if scale[\"type\"] != \"symlog\":\n        return alt.Axis(title=title)\n    values = pd.to_numeric(series, errors=\"coerce\").dropna()\n    if values.empty:\n        return alt.Axis(title=title)\n    return alt.Axis(\n        title=title, values=symlog_ticks(values.min(), values.max())\n    )\n\n\ndef is_log(scale):\n    \"\"\"True only for plain log, the one scale that cannot show 0 or negatives.\"\"\"\n    return scale[\"type\"] == \"log\"\n\n\ndef in_wan(frame, columns):\n    \"\"\"Return a copy with the given euro columns rescaled to 10k euros.\"\"\"\n    return frame.assign(**{c: frame[c] / WAN for c in columns if c in frame})\n\n\ndef wan_column(column, help=None):\n    return st.column_config.NumberColumn(\n        t(f\"col.{column}\"), format=\"localized\", help=help\n    )\n\n\ndef text_column(column):\n    return st.column_config.TextColumn(t(f\"col.{column}\"))\n\n\ndef number_column(column, **kw):\n    return st.column_config.NumberColumn(t(f\"col.{column}\"), **kw)\n\n\ndef reference_line_controls(key, default=()):\n    with st.expander(t(\"ref.title\"), expanded=bool(default)):\n        chosen = st.multiselect(\n            t(\"ref.presets\"),\n            list(REFERENCE_PRESETS),\n            default=list(default),\n            key=f\"ref_presets_{key}\",\n        )\n        col_h, col_v = st.columns(2)\n        text_h = col_h.text_input(\n            t(\"ref.horizontal\"), key=f\"ref_h_{key}\", placeholder=t(\"ref.placeholder\")\n        )\n        text_v = col_v.text_input(\n            t(\"ref.vertical\"), key=f\"ref_v_{key}\", placeholder=t(\"ref.placeholder\")\n        )\n        col_on, col_a, col_b = st.columns([2, 1, 1])\n        use_linear = col_on.checkbox(t(\"ref.linear\"), key=f\"ref_line_{key}\")\n        slope = col_a.number_input(\n            \"a\", value=1.0, step=0.5, key=f\"ref_a_{key}\", disabled=not use_linear\n        )\n        intercept = col_b.number_input(\n            \"b\", value=0.0, step=1.0, key=f\"ref_b_{key}\", disabled=not use_linear\n        )\n\n    specs = [REFERENCE_PRESETS[name]() for name in chosen]\n    values_h, bad_h = parse_number_list(text_h)\n    values_v, bad_v = parse_number_list(text_v)\n    specs += [ref_horizontal(v) for v in values_h]\n    specs += [ref_vertical(v) for v in values_v]\n    if use_linear:\n        specs.append(ref_linear(slope, intercept))\n    if bad_h or bad_v:\n        st.warning(t(\"ref.bad_numbers\", items=t(\"sep.list\").join(bad_h + bad_v)))\n    return specs\n\n\ndef reference_layer(specs, x_bounds, y_bounds, x_col, y_col, x_scale, y_scale):\n    \"\"\"Build one Altair layer holding every requested guide line.\n\n    All lines share a colour and are split by `detail` rather than encoded by\n    colour, so they cannot collide with the chart's own colour legend.\n    \"\"\"\n    drawable, dropped = build_reference_lines(\n        specs, x_bounds, y_bounds, x_log=is_log(x_scale), y_log=is_log(y_scale),\n    )\n    if dropped:\n        st.caption(t(\"ref.log_dropped\", items=t(\"sep.list\").join(dropped)))\n    if not drawable:\n        return None\n\n    data = pd.concat(\n        [frame.assign(_line=label) for label, frame in drawable], ignore_index=True\n    ).rename(columns={\"_x\": x_col, \"_y\": y_col})\n    return (\n        alt.Chart(data)\n        .mark_line(color=REFERENCE_COLOR, strokeWidth=2, strokeDash=[7, 5])\n        .encode(\n            x=alt.X(f\"{x_col}:Q\", scale=chart_scale(x_scale)),\n            y=alt.Y(f\"{y_col}:Q\", scale=chart_scale(y_scale)),\n            detail=alt.Detail(\"_line:N\"),\n            tooltip=[alt.Tooltip(\"_line:N\", title=t(\"ref.tooltip\"))],\n        )\n    )\n\n\ndef axis_bounds(frame, column, pad=0.0):\n    values = pd.to_numeric(frame[column], errors=\"coerce\").dropna()\n    if values.empty:\n        return (0.0, 1.0)\n    low, high = float(values.min()), float(values.max())\n    if low == high:\n        return (low - 1, high + 1)\n    span = (high - low) * pad\n    return (low - span, high + span)\n\n\ndef chart_scale(scale, zero=None):\n    if scale[\"type\"] == \"log\":\n        return alt.Scale(type=\"log\")\n    if scale[\"type\"] == \"symlog\":\n        return alt.Scale(type=\"symlog\", constant=scale[\"constant\"])\n    if zero is None:\n        return alt.Scale(type=\"linear\")\n    return alt.Scale(type=\"linear\", zero=zero)\n\n\ndef chart_explorer(\n    frame,\n    *,\n    key,\n    axis_options,\n    money_columns,\n    bin_settings,\n    axis_notes,\n    tooltip_fields,\n    default_x,\n    default_y,\n    diagonal_pair=None,\n):\n    \"\"\"The full chart block: raw scatter, binned scatter, histogram, guides.\n\n    Shared by the transfer chart tab and the money-x-performance tab so the two\n    stay feature-identical; only the frame and the axis vocabulary differ.\n    tooltip_fields is a list of (column, alt.Tooltip) pairs - a column already\n    sitting on an axis is dropped so it never appears twice in the tooltip.\n    \"\"\"\n    chart_type = remember(f\"{key}_chart_type\", st.radio(\n        t(\"chart.type\"),\n        list(CHART_TYPES),\n        index=sticky_index(f\"{key}_chart_type\", CHART_TYPES, \"scatter\"),\n        format_func=CHART_TYPES.get,\n        horizontal=True,\n        key=keyed(f\"{key}_chart_type\"),\n    ))\n\n    if chart_type == \"scatter\":\n        axis_col1, axis_col2 = st.columns(2)\n        with axis_col1:\n            x_axis = remember(f\"{key}_x_axis\", st.selectbox(\n                t(\"chart.x_axis\"),\n                list(axis_options),\n                index=sticky_index(f\"{key}_x_axis\", axis_options, default_x),\n                format_func=axis_options.get,\n                key=keyed(f\"{key}_x_axis\"),\n            ))\n            x_scale = scale_picker(t(\"chart.x_scale\"), f\"{key}_scatter_x_scale\")\n        with axis_col2:\n            y_axis = remember(f\"{key}_y_axis\", st.selectbox(\n                t(\"chart.y_axis\"),\n                list(axis_options),\n                index=sticky_index(f\"{key}_y_axis\", axis_options, default_y),\n                format_func=axis_options.get,\n                key=keyed(f\"{key}_y_axis\"),\n            ))\n            y_scale = scale_picker(t(\"chart.y_scale\"), f\"{key}_scatter_y_scale\")\n        scatter_mode = remember(f\"{key}_scatter_mode\", st.radio(\n            t(\"chart.mode\"),\n            list(SCATTER_MODES),\n            index=sticky_index(f\"{key}_scatter_mode\", SCATTER_MODES, \"raw\"),\n            format_func=SCATTER_MODES.get,\n            horizontal=True,\n            key=keyed(f\"{key}_scatter_mode\"),\n        ))\n        if scatter_mode == \"binned\":\n            summary_col1, summary_col2 = st.columns(2)\n            default_bin_size, bin_step = bin_settings.get(x_axis, (1.0, 1.0))\n            with summary_col1:\n                scatter_bin_size = st.number_input(\n                    t(\"chart.bin_size_x\"),\n                    min_value=bin_step,\n                    value=default_bin_size,\n                    step=bin_step,\n                    key=f\"{key}_scatter_bin_size_{x_axis}\",\n                    help=t(\"chart.bin_help\", axis=axis_options[x_axis]),\n                )\n            with summary_col2:\n                error_mode = remember(f\"{key}_error_mode\", st.selectbox(\n                    t(\"chart.error_bar\"),\n                    list(ERROR_BAR_OPTIONS),\n                    index=sticky_index(f\"{key}_error_mode\", ERROR_BAR_OPTIONS, \"ci95\"),\n                    format_func=ERROR_BAR_OPTIONS.get,\n                    key=keyed(f\"{key}_error_mode\"),\n                ))\n    else:\n        bar_axis_col1, bar_axis_col2 = st.columns(2)\n        with bar_axis_col1:\n            x_axis = remember(f\"{key}_bar_x_axis\", st.selectbox(\n                t(\"chart.x_axis\"),\n                list(axis_options),\n                index=sticky_index(f\"{key}_bar_x_axis\", axis_options, default_x),\n                format_func=axis_options.get,\n                key=keyed(f\"{key}_bar_x_axis\"),\n            ))\n            x_scale = scale_picker(t(\"chart.x_scale\"), f\"{key}_bar_x_scale\")\n        with bar_axis_col2:\n            st.text_input(\n                t(\"chart.y_axis\"),\n                value=t(\"chart.count\"),\n                disabled=True,\n                key=f\"{key}_bar_y_axis\",\n            )\n            y_scale = scale_picker(t(\"chart.y_scale\"), f\"{key}_bar_y_scale\")\n        default_bin_size, bin_step = bin_settings.get(x_axis, (1.0, 1.0))\n        bin_size = st.number_input(\n            t(\"chart.bin_size\"),\n            min_value=bin_step,\n            value=default_bin_size,\n            step=bin_step,\n            key=f\"{key}_bin_size_{x_axis}\",\n            help=t(\"chart.bin_help\", axis=axis_options[x_axis]),\n        )\n\n    required_axes = [x_axis, y_axis] if chart_type == \"scatter\" else [x_axis]\n\n    # The buy/sell fee pair used to get a hardcoded 1:1 line. It is now just the\n    # default preset, so the same mechanism serves every axis combination.\n    default_refs = (\n        [\"y = x\"]\n        if chart_type == \"scatter\"\n        and diagonal_pair is not None\n        and {x_axis, y_axis} == diagonal_pair\n        else []\n    )\n    reference_specs = reference_line_controls(f\"{key}_chart\", default=default_refs)\n\n    chart_df = in_wan(frame, money_columns).dropna(subset=required_axes)\n\n    notes = [\n        note for axis, note in axis_notes.items() if axis in required_axes\n    ]\n    if notes:\n        st.caption(\" \".join(dict.fromkeys(notes)))\n\n    log_exclusions = []\n    if is_log(x_scale):\n        excluded = int((chart_df[x_axis] <= 0).sum())\n        chart_df = chart_df[chart_df[x_axis] > 0]\n        if excluded:\n            log_exclusions.append(t(\"chart.log_excluded_x\", n=f\"{excluded:,}\"))\n    if chart_type == \"scatter\" and is_log(y_scale):\n        excluded = int((chart_df[y_axis] <= 0).sum())\n        chart_df = chart_df[chart_df[y_axis] > 0]\n        if excluded:\n            log_exclusions.append(t(\"chart.log_excluded_y\", n=f\"{excluded:,}\"))\n    if log_exclusions:\n        st.caption(\n            t(\"chart.log_excluded\", items=t(\"sep.list\").join(log_exclusions))\n        )\n\n    if chart_type == \"scatter\" and scatter_mode == \"raw\":\n        st.caption(t(\"chart.scatter_count\", n=f\"{len(chart_df):,}\"))\n    elif chart_type == \"bar\":\n        st.caption(\n            t(\"chart.bar_count\", n=f\"{len(chart_df):,}\", width=f\"{bin_size:g}\")\n        )\n\n    if chart_df.empty:\n        st.warning(t(\"chart.no_data\"))\n    elif chart_type == \"scatter\":\n        if scatter_mode == \"raw\":\n            tooltips = [\n                spec for column, spec in tooltip_fields\n                if column not in (x_axis, y_axis)\n            ] + [\n                alt.Tooltip(x_axis, title=axis_options[x_axis], format=\",.2f\"),\n                alt.Tooltip(y_axis, title=axis_options[y_axis], format=\",.2f\"),\n            ]\n            points = (\n                alt.Chart(chart_df)\n                .mark_circle(size=65, opacity=0.68)\n                .encode(\n                    x=alt.X(\n                        x_axis,\n                        scale=chart_scale(x_scale),\n                        axis=axis_for(x_scale, chart_df[x_axis], axis_options[x_axis]),\n                    ),\n                    y=alt.Y(\n                        y_axis,\n                        scale=chart_scale(y_scale),\n                        axis=axis_for(y_scale, chart_df[y_axis], axis_options[y_axis]),\n                    ),\n                    color=alt.Color(\"league:N\", title=t(\"col.league\")),\n                    tooltip=tooltips,\n                )\n            )\n            chart = points\n        else:\n            summary = aggregate_scatter_bins(\n                chart_df,\n                x_axis,\n                y_axis,\n                scatter_bin_size,\n                error_mode,\n            )\n            error_rows = summary.dropna(subset=[\"error_low\", \"error_high\"])\n            nonpositive_error_bars = 0\n            if is_log(y_scale):\n                nonpositive_error_bars = int((error_rows[\"error_low\"] <= 0).sum())\n                error_rows = error_rows[error_rows[\"error_low\"] > 0]\n            summary_points = (\n                alt.Chart(summary)\n                .mark_circle(size=95, opacity=0.9, color=\"#2F9FC4\")\n                .encode(\n                    x=alt.X(\n                        \"x_center:Q\",\n                        scale=chart_scale(x_scale, zero=False),\n                        axis=axis_for(\n                            x_scale, summary[\"x_center\"],\n                            t(\"chart.bin_center\", axis=axis_options[x_axis]),\n                        ),\n                    ),\n                    y=alt.Y(\n                        \"y_mean:Q\",\n                        scale=chart_scale(y_scale),\n                        axis=axis_for(\n                            y_scale, summary[\"y_mean\"],\n                            t(\"chart.bin_mean\", axis=axis_options[y_axis]),\n                        ),\n                    ),\n                    tooltip=[\n                        alt.Tooltip(\n                            \"bin_start:Q\", title=t(\"tooltip.bin_start\"), format=\",.2f\"\n                        ),\n                        alt.Tooltip(\n                            \"bin_end:Q\", title=t(\"tooltip.bin_end\"), format=\",.2f\"\n                        ),\n                        alt.Tooltip(\"count:Q\", title=t(\"tooltip.sample\"), format=\",d\"),\n                        alt.Tooltip(\n                            \"y_mean:Q\", title=t(\"tooltip.y_mean\"), format=\",.2f\"\n                        ),\n                        alt.Tooltip(\n                            \"error:Q\",\n                            title=ERROR_BAR_OPTIONS[error_mode],\n                            format=\",.2f\",\n                        ),\n                    ],\n                )\n            )\n            error_rules = (\n                alt.Chart(error_rows)\n                .mark_rule(color=\"#738496\", strokeWidth=2)\n                .encode(\n                    x=alt.X(\"x_center:Q\"),\n                    y=alt.Y(\"error_low:Q\"),\n                    y2=alt.Y2(\"error_high:Q\"),\n                )\n            )\n            lower_caps = (\n                alt.Chart(error_rows)\n                .mark_tick(\n                    orient=\"horizontal\",\n                    color=\"#738496\",\n                    thickness=2,\n                    size=13,\n                )\n                .encode(x=alt.X(\"x_center:Q\"), y=alt.Y(\"error_low:Q\"))\n            )\n            upper_caps = (\n                alt.Chart(error_rows)\n                .mark_tick(\n                    orient=\"horizontal\",\n                    color=\"#738496\",\n                    thickness=2,\n                    size=13,\n                )\n                .encode(x=alt.X(\"x_center:Q\"), y=alt.Y(\"error_high:Q\"))\n            )\n            chart = error_rules + lower_caps + upper_caps + summary_points\n            single_record_bins = int((summary[\"count\"] == 1).sum())\n            st.caption(\n                t(\n                    \"chart.binned_caption\",\n                    n=f\"{len(chart_df):,}\",\n                    bins=f\"{len(summary):,}\",\n                    error=ERROR_BAR_OPTIONS[error_mode],\n                )\n                + (\n                    t(\"chart.binned_single\", n=f\"{single_record_bins:,}\")\n                    if single_record_bins\n                    else \"\"\n                )\n                + (\n                    t(\"chart.binned_nonpositive\", n=f\"{nonpositive_error_bars:,}\")\n                    if nonpositive_error_bars\n                    else \"\"\n                )\n            )\n\n        if scatter_mode == \"raw\":\n            ref_source, ref_x, ref_y = chart_df, x_axis, y_axis\n        else:\n            ref_source, ref_x, ref_y = summary, \"x_center\", \"y_mean\"\n        # A y = x line only means anything if both axes share a unit, so span it\n        # over their combined extent rather than each axis separately.\n        span = (\n            pd.concat([ref_source[ref_x], ref_source[ref_y]])\n            .agg([\"min\", \"max\"]).tolist()\n        )\n        reference = reference_layer(\n            reference_specs, span, span, ref_x, ref_y, x_scale, y_scale\n        )\n        if reference is not None:\n            chart = chart + reference\n            st.caption(t(\"ref.note\"))\n\n        st.altair_chart(\n            chart.properties(height=560).interactive(),\n            width=\"stretch\",\n        )\n    else:\n        histogram = chart_df[[x_axis]].copy()\n        histogram[\"_bin_start\"] = (\n            np.floor(histogram[x_axis] / bin_size) * bin_size\n        ).round(10)\n        histogram = (\n            histogram.groupby(\"_bin_start\", as_index=False)\n            .agg(\n                _count=(x_axis, \"size\"),\n                _min_value=(x_axis, \"min\"),\n            )\n        )\n        histogram[\"_bin_end\"] = (histogram[\"_bin_start\"] + bin_size).round(10)\n        histogram[\"_plot_start\"] = histogram[\"_bin_start\"]\n        if is_log(x_scale):\n            histogram[\"_plot_start\"] = np.where(\n                histogram[\"_bin_start\"] > 0,\n                histogram[\"_bin_start\"],\n                histogram[\"_min_value\"],\n            )\n\n        bars = (\n            alt.Chart(histogram)\n            .mark_bar(color=\"#2F9FC4\", opacity=0.82)\n            .encode(\n                x=alt.X(\n                    \"_plot_start:Q\",\n                    scale=chart_scale(x_scale, zero=False),\n                    axis=axis_for(\n                        x_scale, histogram[\"_plot_start\"], axis_options[x_axis]\n                    ),\n                ),\n                x2=alt.X2(\"_bin_end:Q\"),\n                y=alt.Y(\n                    \"_count:Q\",\n                    scale=chart_scale(y_scale),\n                    axis=axis_for(y_scale, histogram[\"_count\"], t(\"chart.count\")),\n                ),\n                tooltip=[\n                    alt.Tooltip(\n                        \"_bin_start:Q\", title=t(\"tooltip.range_start\"), format=\",.2f\"\n                    ),\n                    alt.Tooltip(\n                        \"_bin_end:Q\", title=t(\"tooltip.range_end\"), format=\",.2f\"\n                    ),\n                    alt.Tooltip(\"_count:Q\", title=t(\"chart.count\"), format=\",d\"),\n                ],\n            )\n        )\n        bar_reference = reference_layer(\n            reference_specs,\n            axis_bounds(histogram, \"_plot_start\"),\n            axis_bounds(histogram, \"_count\"),\n            \"_plot_start\", \"_count\", x_scale, y_scale,\n        )\n        if bar_reference is not None:\n            bars = bars + bar_reference\n            st.caption(t(\"ref.note\"))\n        st.altair_chart(\n            bars.properties(height=560).interactive(),\n            width=\"stretch\",\n        )\n\n\ndef db_version():\n    \"\"\"Invalidate Streamlit's table cache whenever the SQLite file changes.\"\"\"\n    try:\n        return DEFAULT_DB.stat().st_mtime_ns\n    except FileNotFoundError:\n        return 0\n\n\ndef season_sort_key(season):\n    return int(str(season).split(\"/\")[0])\n\n\ndef numeric_limits(frame, column, scale=1, step=1):\n    values = pd.to_numeric(frame[column], errors=\"coerce\").dropna() / scale\n    if values.empty:\n        return (0, step)\n    low = math.floor(float(values.min()) / step) * step\n    high = math.ceil(float(values.max()) / step) * step\n    if low == high:\n        high += step\n    if isinstance(step, int):\n        return int(low), int(high)\n    return float(low), float(high)\n\n\ndef numeric_filter_control(\n    frame,\n    column,\n    key,\n    *,\n    scale=1,\n    step=1,\n    default_enabled=False,\n    default_low=None,\n):\n    label = t(\"filter.range\", label=t(f\"col.{column}\"))\n    full_range = numeric_limits(frame, column, scale=scale, step=step)\n    initial_low = full_range[0] if default_low is None else max(\n        full_range[0], min(default_low, full_range[1])\n    )\n    enabled = st.checkbox(\n        t(\"filter.enable\", label=label),\n        value=default_enabled,\n        key=f\"enable_{key}\",\n    )\n    bounds = st.slider(\n        label,\n        min_value=full_range[0],\n        max_value=full_range[1],\n        value=(initial_low, full_range[1]),\n        step=step,\n        disabled=not enabled,\n        key=f\"range_{key}\",\n    )\n    return enabled, column, bounds, scale\n\n\ndef season_filter_control(frame, column, key):\n    label = t(\"filter.range\", label=t(f\"col.{column}\"))\n    options = sorted(frame[column].dropna().unique(), key=season_sort_key)\n    enabled = st.checkbox(\n        t(\"filter.enable\", label=label), value=False, key=f\"enable_{key}\"\n    )\n    bounds = st.select_slider(\n        label,\n        options=options,\n        value=(options[0], options[-1]),\n        disabled=not enabled,\n        key=f\"range_{key}\",\n    )\n    return enabled, column, bounds\n\n\ndef apply_numeric_range(frame, column, bounds, scale=1):\n    low, high = bounds\n    values = pd.to_numeric(frame[column], errors=\"coerce\")\n    return frame[values.between(low * scale, high * scale, inclusive=\"both\")]\n\n\ndef apply_season_range(frame, column, bounds):\n    low, high = map(season_sort_key, bounds)\n    values = pd.to_numeric(\n        frame[column].astype(\"string\").str.split(\"/\").str[0],\n        errors=\"coerce\",\n    )\n    return frame[values.between(low, high, inclusive=\"both\")]\n\n\n@st.cache_data(show_spinner=False)\ndef local_tables(version):\n    \"\"\"Every table the app reads, from the database sitting next to it.\"\"\"\n    del version\n    return {\n        name: load_table(name)\n        for name in list(REQUIRED_COLUMNS) + OPTIONAL_TABLES\n    }\n\n\n@st.cache_data(show_spinner=False)\ndef parse_upload(payload):\n    \"\"\"Cached on the files' bytes, so switching tabs does not re-parse them.\"\"\"\n    return read_upload(list(payload))\n\n\n@st.cache_data(show_spinner=False)\ndef demo_data():\n    return demo_tables()\n\n\ndef source_panel(offer_demo=True):\n    \"\"\"The uploader and the demo button, identical on the landing page and in\n    the sidebar of a loaded app.\n\n    offer_demo is false once the demo is what is already on screen: a button\n    that cannot change anything is worse than no button.\n    \"\"\"\n    st.file_uploader(\n        t(\"data.upload\"), type=SUFFIXES, accept_multiple_files=True,\n        help=t(\"data.upload_help\"), key=\"db_upload\",\n    )\n    st.caption(t(\"data.formats\", formats=describe_accepted()))\n    if offer_demo:\n        st.button(t(\"data.demo\"), help=t(\"data.demo_help\"), key=\"load_demo\",\n                  use_container_width=True)\n\n\ndef schema_help():\n    st.info(t(\"data.welcome\"))\n    st.caption(t(\"data.privacy\"))\n    st.markdown(f\"**{t('data.schema')}**\")\n    for table in REQUIRED_COLUMNS:\n        st.markdown(f\"`{table}`\")\n        st.code(describe_schema(table), language=\"text\")\n    st.caption(t(\"data.schema_optional\"))\n\n\nversion = db_version()\nuploaded = st.session_state.get(\"db_upload\") or []\n\n# The published page carries no database, so it lands on the upload panel;\n# a local checkout has one and behaves exactly as before. Same code either way.\ntables, source_note = None, None\n# Tracked here rather than read back off the frames: st.cache_data round-trips\n# them, and a warning that says the numbers are invented is not something to\n# make contingent on DataFrame.attrs surviving a serialiser.\nshowing_demo = False\n\n# A button reads True only on the run right after the click, so latch it. Done\n# here rather than in the landing branch so the button works from the sidebar\n# of a loaded app too - a local checkout has a database and would never reach\n# the landing page at all.\nif st.session_state.get(\"load_demo\"):\n    st.session_state[\"demo_active\"] = True\n\nif uploaded:\n    try:\n        tables = parse_upload(tuple((f.name, f.getvalue()) for f in uploaded))\n        source_note = t(\"data.using_upload\")\n    except UploadError as error:\n        st.error(f\"{t('data.rejected')}: {error}\")\nelif st.session_state.get(\"demo_active\"):\n    tables = demo_data()\n    source_note = t(\"data.using_demo\")\n    showing_demo = True\nelif DEFAULT_DB.exists():\n    candidate = local_tables(version)\n    if not candidate[\"spells\"].empty:\n        tables = candidate\n        source_note = t(\"data.using_local\")\n\nif tables is None:\n    st.title(t(\"app.title\"))\n    with st.sidebar:\n        st.radio(\n            t(\"lang.label\"), list(LANGUAGES), format_func=LANGUAGES.get,\n            horizontal=True, key=\"lang\",\n        )\n        st.header(t(\"data.source\"))\n        source_panel()\n    schema_help()\n    st.stop()\n\nspells = tables[\"spells\"]\n\n# Filtering runs on the code columns; the label columns exist only to be read.\nsell_type = spells[\"sell_type\"].where(\n    spells[\"sell_type\"].isin(OUTCOME_CODES), None\n)\nspells = spells.assign(\n    outcome_code=sell_type.fillna(\"unknown\"),\n    league_code=spells[\"league\"].fillna(OTHER_LEAGUE),\n)\nspells = spells.assign(\n    outcome=spells[\"outcome_code\"].map(lambda c: t(f\"outcome.{c}\")),\n    league=spells[\"league_code\"].map(league_label),\n)\n\nst.title(t(\"app.title\"))\nst.caption(t(\"app.caption\"))\n\n# Said on every screen, not once at load. Someone arriving at a shared link to\n# a chart has to be able to see that the numbers under it are invented.\nif showing_demo:\n    st.warning(t(\"data.demo_banner\"))\n\n# --- sidebar filters ---\nwith st.sidebar:\n    st.radio(\n        t(\"lang.label\"),\n        list(LANGUAGES),\n        format_func=LANGUAGES.get,\n        horizontal=True,\n        key=\"lang\",\n    )\n    with st.expander(t(\"data.source\")):\n        source_panel(offer_demo=not showing_demo)\n        st.caption(source_note)\n\n    st.header(t(\"filter.header\"))\n    numeric_filters = []\n    season_filters = []\n\n    with st.expander(t(\"filter.basic\"), expanded=True):\n        player_query = st.text_input(\n            t(\"col.player_name\"),\n            placeholder=t(\"filter.player_placeholder\"),\n            key=\"filter_player\",\n        ).strip()\n        clubs = st.multiselect(\n            t(\"col.club_name\"),\n            sorted(spells[\"club_name\"].dropna().unique()),\n            default=[],\n            help=t(\"filter.clubs_help\"),\n            key=\"filter_clubs\",\n        )\n        league_codes = list(LEAGUES) + [OTHER_LEAGUE]\n        leagues = remember(\"filter_leagues\", st.multiselect(\n            t(\"col.league\"),\n            league_codes,\n            default=sticky(\"filter_leagues\", league_codes),\n            format_func=league_label,\n            help=t(\"filter.leagues_help\"),\n            key=keyed(\"filter_leagues\"),\n        ))\n        outcomes = remember(\"filter_outcomes\", st.multiselect(\n            t(\"filter.outcomes\"),\n            OUTCOME_CODES,\n            default=sticky(\"filter_outcomes\", OUTCOME_CODES),\n            format_func=lambda c: t(f\"outcome.{c}\"),\n            key=keyed(\"filter_outcomes\"),\n        ))\n        only_realized = st.checkbox(\n            t(\"filter.only_realized\"), value=True, key=\"filter_realized\"\n        )\n        exclude_free = st.checkbox(\n            t(\"filter.exclude_free\"), value=True, key=\"filter_free\"\n        )\n\n    with st.expander(t(\"filter.seasons\")):\n        season_filters.append(season_filter_control(spells, \"buy_season\", \"buy_season\"))\n        season_filters.append(\n            season_filter_control(spells, \"sell_season\", \"sell_season\")\n        )\n\n    with st.expander(t(\"filter.age_hold\")):\n        for column in (\"buy_age\", \"sell_age\", \"age_diff\", \"hold_years\"):\n            numeric_filters.append(\n                numeric_filter_control(spells, column, column, step=1)\n            )\n\n    with st.expander(t(\"filter.fees\")):\n        numeric_filters.append(\n            numeric_filter_control(\n                spells, \"buy_fee\", \"buy_fee\", scale=WAN, step=100,\n                default_enabled=True, default_low=100,\n            )\n        )\n        for column in (\n            \"sell_fee\", \"buy_market_value\", \"sell_market_value\",\n            \"buy_value_gap\", \"sell_value_gap\",\n        ):\n            numeric_filters.append(\n                numeric_filter_control(spells, column, column, scale=WAN, step=100)\n            )\n\n    with st.expander(t(\"filter.returns\")):\n        numeric_filters.append(\n            numeric_filter_control(spells, \"profit\", \"profit\", scale=WAN, step=100)\n        )\n        numeric_filters.append(\n            numeric_filter_control(spells, \"roi_mult\", \"roi_mult\", step=0.1)\n        )\n\ndf = spells[\n    spells[\"league_code\"].isin(leagues)\n    & spells[\"outcome_code\"].isin(outcomes)\n]\nif player_query:\n    df = df[\n        df[\"player_name\"].str.contains(player_query, case=False, na=False, regex=False)\n    ]\nif clubs:\n    df = df[df[\"club_name\"].isin(clubs)]\nif only_realized:\n    # sqlite hands booleans back as 0/1 integers\n    df = df[df[\"is_realized\"] == 1]\nif exclude_free:\n    df = df[df[\"buy_fee\"] > 0]\n\nfor enabled, column, bounds in season_filters:\n    if enabled:\n        df = apply_season_range(df, column, bounds)\nfor enabled, column, bounds, scale in numeric_filters:\n    if enabled:\n        df = apply_numeric_range(df, column, bounds, scale=scale)\n\nresolved = df[\"profit\"].notna()\n\ncol_total, col_resolved = st.columns(2)\ncol_total.metric(t(\"metric.total\"), f\"{len(df):,}\")\ncol_resolved.metric(\n    t(\"metric.resolved\"), f\"{int(resolved.sum()):,}\", help=t(\"metric.resolved_help\"),\n)\n\ntab_main, tab_clubs, tab_charts, tab_combo, tab_raw, tab_perf = st.tabs(\n    [t(\"tab.main\"), t(\"tab.clubs\"), t(\"tab.charts\"), t(\"tab.combo\"),\n     t(\"tab.raw\"), t(\"tab.perf\")]\n)\n\nwith tab_main:\n    view = in_wan(\n        df[[\n            \"player_name\", \"club_name\", \"league\",\n            \"buy_season\", \"buy_age\", \"buy_fee\", \"buy_market_value\",\n            \"buy_value_gap\",\n            \"sell_season\", \"sell_age\", \"sell_fee\", \"sell_market_value\",\n            \"sell_value_gap\",\n            \"age_diff\", \"profit\", \"roi_mult\", \"hold_years\", \"outcome\",\n        ]],\n        MONEY_COLUMNS,\n    ).round({\n        \"buy_fee\": 0, \"sell_fee\": 0, \"profit\": 0,\n        \"buy_value_gap\": 0, \"sell_value_gap\": 0,\n    }).sort_values(\n        \"roi_mult\", ascending=False\n    )\n    st.dataframe(\n        view,\n        width=\"stretch\",\n        height=650,\n        column_config={\n            \"player_name\": text_column(\"player_name\"),\n            \"club_name\": text_column(\"club_name\"),\n            \"league\": text_column(\"league\"),\n            \"buy_season\": text_column(\"buy_season\"),\n            \"sell_season\": text_column(\"sell_season\"),\n            \"buy_age\": number_column(\"buy_age\", format=\"%.0f\"),\n            \"sell_age\": number_column(\"sell_age\", format=\"%.0f\"),\n            \"age_diff\": number_column(\"age_diff\", format=\"%.0f\"),\n            \"buy_fee\": wan_column(\"buy_fee\"),\n            \"buy_market_value\": wan_column(\"buy_market_value\"),\n            \"buy_value_gap\": wan_column(\"buy_value_gap\", help=t(\"help.buy_gap\")),\n            \"sell_fee\": wan_column(\"sell_fee\"),\n            \"sell_market_value\": wan_column(\"sell_market_value\"),\n            \"sell_value_gap\": wan_column(\"sell_value_gap\", help=t(\"help.sell_gap\")),\n            \"profit\": wan_column(\"profit\"),\n            \"roi_mult\": number_column(\"roi_mult\", format=\"%.2fx\"),\n            \"hold_years\": number_column(\"hold_years\"),\n            \"outcome\": text_column(\"outcome\"),\n        },\n    )\n    st.download_button(\n        t(\"main.download\"),\n        view.to_csv(index=False).encode(\"utf-8-sig\"),\n        \"transfers_wan.csv\",\n    )\n\nwith tab_clubs:\n    # deals counts only the rows total_profit actually sums, so the two columns\n    # describe the same set; unresolved carries the rest rather than hiding it.\n    by_club = (\n        df.assign(_resolved=resolved.astype(int))\n        .groupby([\"club_name\", \"league\"])\n        .agg(\n            total_profit=(\"profit\", \"sum\"),\n            avg_mult=(\"roi_mult\", \"mean\"),\n            deals=(\"_resolved\", \"sum\"),\n            unresolved=(\"player_name\", \"count\"),\n        )\n        .reset_index()\n    )\n    by_club[\"unresolved\"] -= by_club[\"deals\"]\n    by_club = in_wan(by_club, [\"total_profit\"]).round({\"total_profit\": 0})\n    by_club = by_club.sort_values(\"total_profit\", ascending=False)\n    club_rank_tab, club_scatter_tab = st.tabs(\n        [t(\"tab.club_rank\"), t(\"tab.club_scatter\")]\n    )\n\n    with club_rank_tab:\n        st.dataframe(\n            by_club,\n            width=\"stretch\",\n            height=650,\n            column_config={\n                \"club_name\": text_column(\"club_name\"),\n                \"league\": text_column(\"league\"),\n                \"total_profit\": wan_column(\"total_profit\"),\n                \"avg_mult\": number_column(\"avg_mult\", format=\"%.2fx\"),\n                \"deals\": number_column(\"deals\"),\n                \"unresolved\": number_column(\"unresolved\"),\n            },\n        )\n\n    with club_scatter_tab:\n        club_options = list(dict.fromkeys(by_club[\"club_name\"].dropna()))\n        if not club_options:\n            st.warning(t(\"clubs.none\"))\n        else:\n            selected_club = st.selectbox(\n                t(\"clubs.select\"),\n                club_options,\n                key=\"club_scatter_club\",\n            )\n            club_axis_col1, club_axis_col2 = st.columns(2)\n            with club_axis_col1:\n                club_x_scale = scale_picker(t(\"clubs.buy_scale\"), \"club_x_scale\")\n            with club_axis_col2:\n                club_y_scale = scale_picker(t(\"clubs.sell_scale\"), \"club_y_scale\")\n\n            club_reference_specs = reference_line_controls(\n                \"club_scatter\", default=[\"y = x\"]\n            )\n\n            club_chart_df = in_wan(\n                df[df[\"club_name\"] == selected_club],\n                [\"buy_fee\", \"sell_fee\", \"profit\"],\n            ).dropna(subset=[\"buy_fee\", \"sell_fee\"])\n\n            club_log_exclusions = []\n            if is_log(club_x_scale):\n                excluded = int((club_chart_df[\"buy_fee\"] <= 0).sum())\n                club_chart_df = club_chart_df[club_chart_df[\"buy_fee\"] > 0]\n                if excluded:\n                    club_log_exclusions.append(\n                        t(\"clubs.log_excluded_buy\", n=f\"{excluded:,}\")\n                    )\n            if is_log(club_y_scale):\n                excluded = int((club_chart_df[\"sell_fee\"] <= 0).sum())\n                club_chart_df = club_chart_df[club_chart_df[\"sell_fee\"] > 0]\n                if excluded:\n                    club_log_exclusions.append(\n                        t(\"clubs.log_excluded_sell\", n=f\"{excluded:,}\")\n                    )\n            if club_log_exclusions:\n                st.caption(\n                    t(\n                        \"chart.log_excluded\",\n                        items=t(\"sep.list\").join(club_log_exclusions),\n                    )\n                )\n\n            st.caption(\n                t(\"clubs.caption\", club=selected_club, n=f\"{len(club_chart_df):,}\")\n            )\n            if club_chart_df.empty:\n                st.warning(t(\"clubs.empty\"))\n            else:\n                club_points = (\n                    alt.Chart(club_chart_df)\n                    .mark_circle(size=80, opacity=0.75)\n                    .encode(\n                        x=alt.X(\n                            \"buy_fee:Q\",\n                            scale=chart_scale(club_x_scale),\n                            axis=axis_for(\n                                club_x_scale, club_chart_df[\"buy_fee\"],\n                                t(\"col.buy_fee\"),\n                            ),\n                        ),\n                        y=alt.Y(\n                            \"sell_fee:Q\",\n                            scale=chart_scale(club_y_scale),\n                            axis=axis_for(\n                                club_y_scale, club_chart_df[\"sell_fee\"],\n                                t(\"col.sell_fee\"),\n                            ),\n                        ),\n                        color=alt.Color(\"outcome:N\", title=t(\"col.outcome\")),\n                        tooltip=[\n                            alt.Tooltip(\"player_name:N\", title=t(\"col.player_name\")),\n                            alt.Tooltip(\"buy_season:N\", title=t(\"col.buy_season\")),\n                            alt.Tooltip(\"sell_season:N\", title=t(\"col.sell_season\")),\n                            alt.Tooltip(\n                                \"buy_age:Q\", title=t(\"col.buy_age\"), format=\".0f\"\n                            ),\n                            alt.Tooltip(\n                                \"sell_age:Q\", title=t(\"col.sell_age\"), format=\".0f\"\n                            ),\n                            alt.Tooltip(\n                                \"buy_fee:Q\", title=t(\"col.buy_fee\"), format=\",.0f\"\n                            ),\n                            alt.Tooltip(\n                                \"sell_fee:Q\", title=t(\"col.sell_fee\"), format=\",.0f\"\n                            ),\n                            alt.Tooltip(\n                                \"profit:Q\", title=t(\"col.profit\"), format=\",.0f\"\n                            ),\n                            alt.Tooltip(\n                                \"roi_mult:Q\", title=t(\"col.roi_mult\"), format=\".2f\"\n                            ),\n                        ],\n                    )\n                )\n                club_extent = pd.concat(\n                    [club_chart_df[\"buy_fee\"], club_chart_df[\"sell_fee\"]]\n                )\n                club_span = (float(club_extent.min()), float(club_extent.max()))\n                club_ref = reference_layer(\n                    club_reference_specs, club_span, club_span,\n                    \"buy_fee\", \"sell_fee\", club_x_scale, club_y_scale,\n                )\n                club_chart = club_points if club_ref is None else club_points + club_ref\n                st.caption(t(\"ref.note_diagonal\"))\n                st.altair_chart(\n                    club_chart.properties(height=560).interactive(),\n                    width=\"stretch\",\n                )\n\nwith tab_charts:\n    chart_explorer(\n        df,\n        key=\"main\",\n        axis_options=AXIS_OPTIONS,\n        money_columns=MONEY_COLUMNS,\n        bin_settings=BIN_SETTINGS,\n        axis_notes={\n            \"buy_value_gap\": t(\"help.buy_gap\"),\n            \"sell_value_gap\": t(\"help.sell_gap\"),\n        },\n        tooltip_fields=[\n            (\"player_name\", alt.Tooltip(\"player_name:N\", title=t(\"col.player_name\"))),\n            (\"club_name\", alt.Tooltip(\"club_name:N\", title=t(\"col.club_name\"))),\n            (\"league\", alt.Tooltip(\"league:N\", title=t(\"col.league\"))),\n            (\"buy_season\", alt.Tooltip(\"buy_season:N\", title=t(\"col.buy_season\"))),\n            (\"sell_season\", alt.Tooltip(\"sell_season:N\", title=t(\"col.sell_season\"))),\n        ],\n        default_x=\"buy_fee\",\n        default_y=\"sell_fee\",\n        diagonal_pair={\"buy_fee\", \"sell_fee\"},\n    )\n\nwith tab_combo:\n    combo_all = tables.get(\"spell_performance\", pd.DataFrame())\n    if combo_all.empty:\n        st.info(t(\"combo.needs_data\"))\n        st.code(\".venv/bin/python -m scout.pipeline_perf\")\n    else:\n        # Inherit every sidebar filter through the spell_id intersection - the\n        # rows here are the same spells, just carrying their on-pitch totals.\n        combo = add_perf_metrics(\n            combo_all[\n                (combo_all[\"has_perf_data\"] == 1)\n                & combo_all[\"spell_id\"].isin(df[\"spell_id\"])\n            ]\n        )\n        combo = combo.assign(\n            league=combo[\"league\"].fillna(OTHER_LEAGUE).map(league_label)\n        )\n        st.caption(\n            t(\"combo.caption\", total=f\"{len(df):,}\", n=f\"{len(combo):,}\")\n        )\n\n        # A stored table from before a stat was added simply lacks its column;\n        # offer only what this build of the data actually has.\n        combo_axes = {\n            k: v for k, v in COMBO_AXIS_OPTIONS.items() if k in combo.columns\n        }\n        chart_explorer(\n            combo,\n            key=\"combo\",\n            axis_options=combo_axes,\n            money_columns=COMBO_MONEY_COLUMNS,\n            bin_settings=COMBO_BIN_SETTINGS,\n            axis_notes=COMBO_AXIS_NOTES,\n            tooltip_fields=[\n                (\"player_name\",\n                 alt.Tooltip(\"player_name:N\", title=t(\"col.player_name\"))),\n                (\"club_name\", alt.Tooltip(\"club_name:N\", title=t(\"col.club_name\"))),\n                (\"buy_season\", alt.Tooltip(\"buy_season:N\", title=t(\"col.buy_season\"))),\n                (\"sell_season\",\n                 alt.Tooltip(\"sell_season:N\", title=t(\"col.sell_season\"))),\n                (\"tm_apps\",\n                 alt.Tooltip(\"tm_apps:Q\", title=t(\"col.tm_apps\"), format=\",.0f\")),\n                (\"tm_goals\",\n                 alt.Tooltip(\"tm_goals:Q\", title=t(\"col.tm_goals\"), format=\",.0f\")),\n                (\"tm_assists\",\n                 alt.Tooltip(\"tm_assists:Q\", title=t(\"col.tm_assists\"), format=\",.0f\")),\n            ],\n            default_x=\"buy_fee\",\n            default_y=\"tm_goals\",\n        )\n\nwith tab_raw:\n    st.caption(t(\"raw.caption\"))\n    raw = in_wan(tables[\"transfers\"], [\"fee_eur\", \"mv_at_time_eur\"]).round(\n        {\"fee_eur\": 0, \"mv_at_time_eur\": 0}\n    )\n    st.dataframe(\n        raw,\n        width=\"stretch\",\n        height=650,\n        column_config={\n            \"fee_eur\": wan_column(\"fee_eur\"),\n            \"mv_at_time_eur\": wan_column(\"mv_at_time_eur\"),\n            \"age\": number_column(\"age\", format=\"%.0f\"),\n        },\n    )\n\nwith tab_perf:\n    # The performance dataset is meant to be taken away and analysed in pandas,\n    # not browsed here. So this tab exports and reports coverage; it does not\n    # try to visualise 200 columns.\n    st.caption(t(\"perf.caption\"))\n\n    perf = tables.get(\"spell_performance\", pd.DataFrame())\n    if perf.empty:\n        st.info(t(\"perf.not_built\"))\n        st.code(\n            \".venv/bin/python -m scout.pipeline_perf\\n\"\n            \".venv/bin/python -m scout.export\"\n        )\n    else:\n        # sqlite hands booleans back as 0/1 integers, so this has to be an\n        # explicit comparison - `perf[perf[\"has_perf_data\"]]` would be read as\n        # a column selector and raise.\n        has_perf = perf[\"has_perf_data\"] == 1\n        covered = int(has_perf.sum())\n        col_a, col_b, col_c = st.columns(3)\n        col_a.metric(t(\"perf.total\"), f\"{len(perf):,}\")\n        col_b.metric(t(\"perf.covered\"), f\"{covered:,}\", help=t(\"perf.covered_help\"))\n        col_c.metric(t(\"perf.rate\"), f\"{covered / max(len(perf), 1):.0%}\")\n\n        for name, label in (\n            (\"player_season_wide\", t(\"perf.wide_label\")),\n            (\"spell_performance\", t(\"perf.spell_label\")),\n        ):\n            path = EXPORT_DIR / f\"{name}.csv\"\n            if path.exists():\n                st.download_button(\n                    t(\"perf.download\", label=label),\n                    path.read_bytes(),\n                    f\"{name}.csv\",\n                    key=f\"dl_{name}\",\n                )\n            else:\n                st.caption(t(\"perf.not_exported\", label=label))\n\n        st.dataframe(\n            perf[has_perf][[\n                \"player_name\", \"club_name\", \"buy_season\", \"sell_season\",\n                \"seasons\", \"tm_apps\", \"tm_minutes\", \"tm_goals\", \"tm_assists\",\n                \"fb_xg\", \"roi_mult\",\n            ]].sort_values(\"tm_goals\", ascending=False),\n            width=\"stretch\",\n            height=420,\n            column_config={\n                \"player_name\": text_column(\"player_name\"),\n                \"club_name\": text_column(\"club_name\"),\n                \"buy_season\": text_column(\"buy_season\"),\n                \"sell_season\": text_column(\"sell_season\"),\n                \"seasons\": number_column(\"seasons\"),\n                \"tm_apps\": number_column(\"tm_apps\"),\n                \"tm_minutes\": number_column(\"tm_minutes\", format=\"localized\"),\n                \"tm_goals\": number_column(\"tm_goals\"),\n                \"tm_assists\": number_column(\"tm_assists\"),\n                \"fb_xg\": number_column(\"fb_xg\", format=\"%.1f\"),\n                \"roi_mult\": number_column(\"roi_mult\", format=\"%.2fx\"),\n            },\n        )\n",
 "scout/constants.py": "LEAGUES = {\n    \"GB1\": \"premier-league\",\n    \"ES1\": \"laliga\",\n    \"IT1\": \"serie-a\",\n    \"L1\": \"bundesliga\",\n    \"FR1\": \"ligue-1\",\n}\n\nSEASONS = list(range(2015, 2025))\n\nWINDOWS = {\"summer\": \"s\", \"winter\": \"w\"}\n\n# Not real clubs. \"Without Club\" is a contract expiry; \"Retired\" has no link at\n# all so its id parses as None. See spike/NOTES.md section 5.\nPSEUDO_CLUBS = {\"515\", None}\n\n_BASE = (\n    \"https://www.transfermarkt.com/{slug}/transfers/wettbewerb/{code}\"\n    \"/plus/?saison_id={season}&s_w={window}&leihe=0&intern=0\"\n)\n\n\ndef build_url(league_code, season, window):\n    return _BASE.format(\n        slug=LEAGUES[league_code],\n        code=league_code,\n        season=season,\n        window=WINDOWS[window],\n    )\n",
