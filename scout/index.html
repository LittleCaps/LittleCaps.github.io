 "scout/export.py": "\"\"\"Materialise the analysis-ready exports.\n\nThe point of this project is the dataset, not the app, so the exports are the\ndeliverable: one wide row per player-club-season-competition, plus per-spell\ntotals. Both formats are written - CSV to open anywhere, Parquet to keep dtypes\nand read fast.\n\"\"\"\nfrom pathlib import Path\n\nfrom scout.store.db import DEFAULT_DB, init_db, load_table, save_table\nfrom scout.store.source import OPTIONAL_TABLES, REQUIRED_COLUMNS\n\nDEFAULT_EXPORT_DIR = Path(\"data/exports\")\n\nTABLES = {\n    \"player_season_wide\": \"player_season_wide\",\n    \"spell_performance\": \"spell_performance\",\n}\n\n\ndef export_table(name, table, export_dir=DEFAULT_EXPORT_DIR, db_path=DEFAULT_DB):\n    frame = load_table(table, db_path)\n    export_dir = Path(export_dir)\n    export_dir.mkdir(parents=True, exist_ok=True)\n\n    csv_path = export_dir / f\"{name}.csv\"\n    # utf-8-sig, or Excel renders every Chinese column header as mojibake.\n    frame.to_csv(csv_path, index=False, encoding=\"utf-8-sig\")\n\n    parquet_path = export_dir / f\"{name}.parquet\"\n    frame.to_parquet(parquet_path, index=False)\n    return {\"rows\": len(frame), \"csv\": csv_path, \"parquet\": parquet_path}\n\n\ndef export_all(export_dir=DEFAULT_EXPORT_DIR, db_path=DEFAULT_DB):\n    return {\n        name: export_table(name, table, export_dir, db_path)\n        for name, table in TABLES.items()\n    }\n\n\nDEFAULT_WEB_DB = DEFAULT_EXPORT_DIR / \"scout_web.db\"\n\n\ndef write_web_db(out_path=DEFAULT_WEB_DB, db_path=DEFAULT_DB):\n    \"\"\"A slim database holding only what the app reads, for uploading.\n\n    The working database is ~160 MB, almost all of it the 108,984-row wide\n    table the pipeline needs and the page never opens. Copying just the three\n    tables and vacuuming brings it to single-digit MB - small enough to hand\n    to a browser.\n    \"\"\"\n    import sqlite3\n\n    out_path = Path(out_path)\n    out_path.parent.mkdir(parents=True, exist_ok=True)\n    out_path.unlink(missing_ok=True)\n    init_db(out_path)\n    for table in list(REQUIRED_COLUMNS) + OPTIONAL_TABLES:\n        frame = load_table(table, db_path)\n        if frame.empty and table in OPTIONAL_TABLES:\n            continue\n        save_table(frame, table, out_path)\n    with sqlite3.connect(out_path) as conn:\n        conn.execute(\"VACUUM\")\n    return out_path\n\n\nif __name__ == \"__main__\":\n    for name, result in export_all().items():\n        print(f\"{name}: {result['rows']:,} rows -> {result['csv']}, {result['parquet']}\")\n    web = write_web_db()\n    print(f\"web upload db: {web} ({web.stat().st_size / 1e6:.1f} MB)\")\n",
 "scout/i18n.py": "\"\"\"Every user-visible string in the app, in both languages.\n\nTwo rules keep the switch from breaking things:\n\n1. Anything the code *compares* or *stores* - filter values, radio options,\n   dataframe cells - is a stable code, never a translated label. Labels are\n   applied at render time through `format_func` or a display column. A value\n   that changed with the language would empty every filter on switching.\n2. `t` raises on an unknown key rather than echoing it, so a typo fails in\n   tests instead of shipping a bare `chart.foo` to the page.\n\nThe money unit stays 万 / 10k euros in both languages: changing the unit with\nthe language would make identical numbers mean different things.\n\"\"\"\n\nLANGUAGES = {\"zh\": \"中文\", \"en\": \"English\"}\nDEFAULT_LANGUAGE = \"zh\"\n\nSTRINGS = {\n    # --- shell ---------------------------------------------------------\n    \"page.title\": {\"zh\": \"转会盈亏\", \"en\": \"Transfer P&L\"},\n    \"app.title\": {\"zh\": \"五大联赛转会盈亏\", \"en\": \"Big-Five Transfer P&L\"},\n    \"app.caption\": {\n        \"zh\": \"金额未做通胀校正 —— 早期赛季的倍数会被系统性高估。数据源 Transfermarkt。\",\n        \"en\": \"Fees are not inflation-adjusted, so multiples in early seasons \"\n              \"run systematically high. Source: Transfermarkt.\",\n    },\n    \"app.db_empty\": {\n        \"zh\": \"数据库为空。先跑 `python -m scout.pipeline`。\",\n        \"en\": \"The database is empty. Run `python -m scout.pipeline` first.\",\n    },\n    \"lang.label\": {\"zh\": \"语言 / Language\", \"en\": \"Language / 语言\"},\n    \"sep.list\": {\"zh\": \"、\", \"en\": \", \"},\n\n    # --- columns -------------------------------------------------------\n    \"col.player_name\": {\"zh\": \"球员\", \"en\": \"Player\"},\n    \"col.club_name\": {\"zh\": \"俱乐部\", \"en\": \"Club\"},\n    \"col.league\": {\"zh\": \"联赛\", \"en\": \"League\"},\n    \"col.buy_season\": {\"zh\": \"买入赛季\", \"en\": \"Buy season\"},\n    \"col.sell_season\": {\"zh\": \"卖出赛季\", \"en\": \"Sell season\"},\n    \"col.outcome\": {\"zh\": \"结局\", \"en\": \"Outcome\"},\n    \"col.buy_fee\": {\"zh\": \"买入费 (万€)\", \"en\": \"Buy fee (10k €)\"},\n    \"col.sell_fee\": {\"zh\": \"卖出费 (万€)\", \"en\": \"Sell fee (10k €)\"},\n    \"col.buy_market_value\": {\"zh\": \"买入时身价 (万€)\", \"en\": \"Value at buy (10k €)\"},\n    \"col.sell_market_value\": {\"zh\": \"卖出时身价 (万€)\", \"en\": \"Value at sale (10k €)\"},\n    \"col.buy_value_gap\": {\"zh\": \"买入身价差 (万€)\", \"en\": \"Buy value gap (10k €)\"},\n    \"col.sell_value_gap\": {\"zh\": \"卖出身价差 (万€)\", \"en\": \"Sell value gap (10k €)\"},\n    \"col.profit\": {\"zh\": \"差价 (万€)\", \"en\": \"Profit (10k €)\"},\n    \"col.roi_mult\": {\"zh\": \"回报倍数\", \"en\": \"Return multiple\"},\n    \"col.hold_years\": {\"zh\": \"持有年数\", \"en\": \"Years held\"},\n    \"col.buy_age\": {\"zh\": \"买入年龄 (岁)\", \"en\": \"Age at buy\"},\n    \"col.sell_age\": {\"zh\": \"卖出年龄 (岁)\", \"en\": \"Age at sale\"},\n    \"col.age_diff\": {\"zh\": \"年龄差 (岁)\", \"en\": \"Age change\"},\n    \"col.cost_per_goal\": {\"zh\": \"每球成本 (万€)\", \"en\": \"Cost per goal (10k €)\"},\n    \"col.goals_per_90\": {\"zh\": \"每90分钟进球\", \"en\": \"Goals per 90\"},\n    \"col.seasons\": {\"zh\": \"覆盖赛季数\", \"en\": \"Seasons covered\"},\n    \"col.tm_apps\": {\"zh\": \"总出场\", \"en\": \"Appearances\"},\n    \"col.tm_goals\": {\"zh\": \"总进球\", \"en\": \"Goals\"},\n    \"col.tm_assists\": {\"zh\": \"总助攻\", \"en\": \"Assists\"},\n    \"col.tm_minutes\": {\"zh\": \"总分钟\", \"en\": \"Minutes\"},\n    \"col.tm_yellow\": {\"zh\": \"总黄牌\", \"en\": \"Yellow cards\"},\n    \"col.tm_red\": {\"zh\": \"总红牌\", \"en\": \"Red cards\"},\n    \"col.fb_xg\": {\"zh\": \"总 xG\", \"en\": \"xG\"},\n    \"col.fb_npxg\": {\"zh\": \"总非点球 xG\", \"en\": \"Non-penalty xG\"},\n    \"col.fb_xag\": {\"zh\": \"总 xAG (预期助攻)\", \"en\": \"xAG (expected assists)\"},\n    \"col.fb_shots\": {\"zh\": \"总射门\", \"en\": \"Shots\"},\n    \"col.fb_shots_on_target\": {\"zh\": \"总射正\", \"en\": \"Shots on target\"},\n    \"col.fb_key_passes\": {\"zh\": \"关键传球\", \"en\": \"Key passes\"},\n    \"col.fb_prog_passes\": {\"zh\": \"推进传球\", \"en\": \"Progressive passes\"},\n    \"col.fb_prog_carries\": {\"zh\": \"推进带球\", \"en\": \"Progressive carries\"},\n    \"col.fb_prog_receptions\": {\"zh\": \"推进接应\", \"en\": \"Progressive receptions\"},\n    \"col.fb_touches\": {\"zh\": \"触球次数\", \"en\": \"Touches\"},\n    \"col.fb_dribbles_won\": {\"zh\": \"过人成功\", \"en\": \"Take-ons won\"},\n    \"col.fb_carry_distance\": {\"zh\": \"带球距离 (码)\", \"en\": \"Carry distance (yd)\"},\n    \"col.fb_tackles\": {\"zh\": \"抢断\", \"en\": \"Tackles\"},\n    \"col.fb_tackles_won\": {\"zh\": \"抢断成功\", \"en\": \"Tackles won\"},\n    \"col.fb_interceptions\": {\"zh\": \"拦截\", \"en\": \"Interceptions\"},\n    \"col.fb_blocks\": {\"zh\": \"封堵\", \"en\": \"Blocks\"},\n    \"col.fb_clearances\": {\"zh\": \"解围\", \"en\": \"Clearances\"},\n    \"col.fb_aerials_won\": {\"zh\": \"争顶成功\", \"en\": \"Aerials won\"},\n    \"col.fb_fouls\": {\"zh\": \"犯规\", \"en\": \"Fouls committed\"},\n    \"col.fb_fouled\": {\"zh\": \"被犯规\", \"en\": \"Fouls drawn\"},\n    \"col.fb_recoveries\": {\"zh\": \"夺回球权\", \"en\": \"Recoveries\"},\n    \"col.fb_saves\": {\"zh\": \"扑救 (门将)\", \"en\": \"Saves (GK)\"},\n    \"col.fb_goals_against\": {\"zh\": \"失球 (门将)\", \"en\": \"Goals against (GK)\"},\n    \"col.fb_clean_sheets\": {\"zh\": \"零封 (门将)\", \"en\": \"Clean sheets (GK)\"},\n    \"col.bl_distance_km\": {\n        \"zh\": \"跑动距离 (km，仅德甲)\", \"en\": \"Distance covered (km, Bundesliga only)\",\n    },\n    \"col.bl_distance_per90\": {\n        \"zh\": \"每90分钟跑动 (km，仅德甲)\", \"en\": \"Distance per 90 (km, Bundesliga only)\",\n    },\n    \"col.bl_sprints\": {\"zh\": \"冲刺次数 (仅德甲)\", \"en\": \"Sprints (Bundesliga only)\"},\n    \"col.bl_intensive_runs\": {\n        \"zh\": \"高强度跑 (仅德甲)\", \"en\": \"Intensive runs (Bundesliga only)\",\n    },\n    \"col.bl_top_speed_kmh\": {\n        \"zh\": \"最高时速 (km/h，仅德甲)\", \"en\": \"Top speed (km/h, Bundesliga only)\",\n    },\n    \"col.fee_eur\": {\"zh\": \"转会费 (万€)\", \"en\": \"Fee (10k €)\"},\n    \"col.mv_at_time_eur\": {\"zh\": \"当时身价 (万€)\", \"en\": \"Value at the time (10k €)\"},\n    \"col.age\": {\"zh\": \"转会时年龄 (岁)\", \"en\": \"Age at transfer\"},\n    \"col.total_profit\": {\"zh\": \"总差价 (万€)\", \"en\": \"Total profit (10k €)\"},\n    \"col.avg_mult\": {\"zh\": \"平均倍数\", \"en\": \"Mean multiple\"},\n    \"col.deals\": {\"zh\": \"可计算笔数\", \"en\": \"Deals with a figure\"},\n    \"col.unresolved\": {\"zh\": \"差价未知\", \"en\": \"Profit unknown\"},\n\n    # --- outcomes (keyed on sell_type, never on the label) -------------\n    \"outcome.transfer\": {\"zh\": \"转会卖出\", \"en\": \"Sold on\"},\n    \"outcome.free\": {\"zh\": \"自由转会 (卖出费 0)\", \"en\": \"Free transfer (fee 0)\"},\n    \"outcome.no_fee\": {\n        \"zh\": \"合同到期/退役 (无转会费)\", \"en\": \"Contract expiry / retired (no fee)\",\n    },\n    \"outcome.undisclosed\": {\"zh\": \"转会费未披露\", \"en\": \"Fee undisclosed\"},\n    \"outcome.still_here\": {\"zh\": \"仍在队中\", \"en\": \"Still at the club\"},\n    \"outcome.unknown_exit\": {\n        \"zh\": \"离队未知 (未采集到卖出)\", \"en\": \"Exit unrecorded (no sale captured)\",\n    },\n    \"outcome.unknown\": {\"zh\": \"未知\", \"en\": \"Unknown\"},\n    \"league.other\": {\"zh\": \"非五大\", \"en\": \"Outside big five\"},\n\n    # --- sidebar -------------------------------------------------------\n    \"filter.header\": {\"zh\": \"筛选\", \"en\": \"Filters\"},\n    \"filter.basic\": {\"zh\": \"基本信息\", \"en\": \"Basics\"},\n    \"filter.player_placeholder\": {\"zh\": \"输入部分姓名\", \"en\": \"Part of a name\"},\n    \"filter.clubs_help\": {\n        \"zh\": \"留空表示全部俱乐部。\", \"en\": \"Leave empty for every club.\",\n    },\n    \"filter.leagues_help\": {\n        \"zh\": \"联赛指效力俱乐部所属联赛。非五大 = 只作为交易对手出现的俱乐部\"\n              \"（如卖去荷甲、英冠的周期）。\",\n        \"en\": \"The league of the club the player was at. Outside big five = \"\n              \"clubs that appear only as counterparties (a sale to the \"\n              \"Eredivisie or the Championship).\",\n    },\n    \"filter.outcomes\": {\"zh\": \"结局\", \"en\": \"Outcome\"},\n    \"filter.only_realized\": {\"zh\": \"只看已兑现\", \"en\": \"Realized spells only\"},\n    \"filter.exclude_free\": {\n        \"zh\": \"排除免签 (买入费=0)\", \"en\": \"Exclude free signings (buy fee 0)\",\n    },\n    \"filter.seasons\": {\"zh\": \"赛季\", \"en\": \"Seasons\"},\n    \"filter.age_hold\": {\"zh\": \"年龄与持有\", \"en\": \"Age and tenure\"},\n    \"filter.fees\": {\"zh\": \"转会费与身价\", \"en\": \"Fees and market value\"},\n    \"filter.returns\": {\"zh\": \"收益\", \"en\": \"Returns\"},\n    \"filter.enable\": {\"zh\": \"启用{label}\", \"en\": \"Enable {label}\"},\n    \"filter.range\": {\"zh\": \"{label}范围\", \"en\": \"{label} range\"},\n\n    # --- headline metrics ----------------------------------------------\n    \"metric.total\": {\"zh\": \"符合条件的转会周期\", \"en\": \"Spells matching the filters\"},\n    \"metric.resolved\": {\"zh\": \"其中差价可计算\", \"en\": \"…with a computable profit\"},\n    \"metric.resolved_help\": {\n        \"zh\": \"剩余的是合同到期/退役或转会费未披露 —— 差价与倍数留空，不按 0 计。\",\n        \"en\": \"The rest expired, retired, or had the fee withheld - profit and \"\n              \"multiple stay blank rather than counting as 0.\",\n    },\n\n    # --- tabs ----------------------------------------------------------\n    \"tab.main\": {\"zh\": \"明细\", \"en\": \"Detail\"},\n    \"tab.clubs\": {\"zh\": \"俱乐部榜\", \"en\": \"Club table\"},\n    \"tab.charts\": {\"zh\": \"图示\", \"en\": \"Charts\"},\n    \"tab.combo\": {\"zh\": \"买卖×表现\", \"en\": \"Money × pitch\"},\n    \"tab.raw\": {\"zh\": \"原始事件\", \"en\": \"Raw events\"},\n    \"tab.perf\": {\"zh\": \"球员表现数据\", \"en\": \"Performance data\"},\n    \"tab.club_rank\": {\"zh\": \"排行榜\", \"en\": \"Ranking\"},\n    \"tab.club_scatter\": {\"zh\": \"买卖散点图\", \"en\": \"Buy vs sell scatter\"},\n\n    # --- shared help ---------------------------------------------------\n    \"help.buy_gap\": {\n        \"zh\": \"买入时身价 − 买入费。正 = 低于身价买入（买得便宜）。\",\n        \"en\": \"Value at buy minus the fee. Positive = bought below the listed \"\n              \"valuation (a bargain).\",\n    },\n    \"help.sell_gap\": {\n        \"zh\": \"卖出时身价 − 卖出费。正 = 低于身价卖出（卖得便宜）。\",\n        \"en\": \"Value at sale minus the fee. Positive = sold below the listed \"\n              \"valuation (money left on the table).\",\n    },\n\n    # --- scales --------------------------------------------------------\n    \"scale.linear\": {\"zh\": \"Linear\", \"en\": \"Linear\"},\n    \"scale.log\": {\"zh\": \"Log (仅正数)\", \"en\": \"Log (positive only)\"},\n    \"scale.symlog\": {\"zh\": \"Symlog (含负数与 0)\", \"en\": \"Symlog (handles 0 and negatives)\"},\n    \"scale.constant\": {\"zh\": \"线性区半宽\", \"en\": \"Linear-region half-width\"},\n    \"scale.constant_help\": {\n        \"zh\": \"|值| 小于该数的区间按线性绘制，超出后转对数。单位与该轴一致。\",\n        \"en\": \"Values below this magnitude are drawn linearly and larger ones \"\n              \"logarithmically. Same unit as the axis.\",\n    },\n\n    # --- error bars ----------------------------------------------------\n    \"errbar.std\": {\"zh\": \"标准差（数据离散程度）\", \"en\": \"Standard deviation (spread)\"},\n    \"errbar.sem\": {\n        \"zh\": \"标准误（均值的不确定性）\", \"en\": \"Standard error (uncertainty of the mean)\",\n    },\n    \"errbar.ci95\": {\"zh\": \"95% 置信区间\", \"en\": \"95% confidence interval\"},\n\n    # --- reference lines -----------------------------------------------\n    \"ref.title\": {\"zh\": \"参考线\", \"en\": \"Reference lines\"},\n    \"ref.presets\": {\"zh\": \"常用\", \"en\": \"Presets\"},\n    \"ref.horizontal\": {\"zh\": \"水平线 y=\", \"en\": \"Horizontal y =\"},\n    \"ref.vertical\": {\"zh\": \"垂直线 x=\", \"en\": \"Vertical x =\"},\n    \"ref.placeholder\": {\"zh\": \"逗号分隔，可多条\", \"en\": \"Comma-separated, several allowed\"},\n    \"ref.linear\": {\"zh\": \"斜线 y = a·x + b\", \"en\": \"Sloped line y = a·x + b\"},\n    \"ref.bad_numbers\": {\n        \"zh\": \"无法解析为数字，已忽略：{items}\",\n        \"en\": \"Not numbers, ignored: {items}\",\n    },\n    \"ref.log_dropped\": {\n        \"zh\": \"Log Scale 无法显示 0 或负值，已略过参考线：{items}\",\n        \"en\": \"A log axis cannot show 0 or negatives, so these lines were \"\n              \"dropped: {items}\",\n    },\n    \"ref.tooltip\": {\"zh\": \"参考线\", \"en\": \"Reference line\"},\n    \"ref.note\": {\"zh\": \"黄色虚线为参考线。\", \"en\": \"The dashed gold lines are the guides.\"},\n    \"ref.note_diagonal\": {\n        \"zh\": \"黄色虚线为参考线。默认 y = x 表示买入费与卖出费相等。\",\n        \"en\": \"The dashed gold lines are the guides; y = x marks a sale at \"\n              \"exactly the buy fee.\",\n    },\n\n    # --- chart explorer -------------------------------------------------\n    \"chart.type\": {\"zh\": \"图表类型\", \"en\": \"Chart type\"},\n    \"chart.scatter\": {\"zh\": \"散点图\", \"en\": \"Scatter\"},\n    \"chart.bar\": {\"zh\": \"柱状图\", \"en\": \"Histogram\"},\n    \"chart.x_axis\": {\"zh\": \"横轴\", \"en\": \"X axis\"},\n    \"chart.y_axis\": {\"zh\": \"纵轴\", \"en\": \"Y axis\"},\n    \"chart.x_scale\": {\"zh\": \"横轴 Scale\", \"en\": \"X scale\"},\n    \"chart.y_scale\": {\"zh\": \"纵轴 Scale\", \"en\": \"Y scale\"},\n    \"chart.mode\": {\"zh\": \"散点模式\", \"en\": \"Scatter mode\"},\n    \"chart.mode_raw\": {\"zh\": \"原始记录\", \"en\": \"Raw records\"},\n    \"chart.mode_binned\": {\"zh\": \"横轴分箱汇总\", \"en\": \"Binned on the x axis\"},\n    \"chart.bin_size_x\": {\"zh\": \"横轴 Bin 大小\", \"en\": \"X bin width\"},\n    \"chart.bin_size\": {\"zh\": \"Bin 大小\", \"en\": \"Bin width\"},\n    \"chart.bin_help\": {\n        \"zh\": \"单位与横轴一致：{axis}。\", \"en\": \"Same unit as the x axis: {axis}.\",\n    },\n    \"chart.error_bar\": {\"zh\": \"误差棒\", \"en\": \"Error bars\"},\n    \"chart.count\": {\"zh\": \"记录数\", \"en\": \"Records\"},\n    \"chart.scatter_count\": {\n        \"zh\": \"图中显示 {n} 条同时具有横纵轴数值的记录。\",\n        \"en\": \"Showing {n} records that have a value on both axes.\",\n    },\n    \"chart.bar_count\": {\n        \"zh\": \"柱状图统计 {n} 条具有横轴数值的记录；每个 Bin 宽度为 {width}，纵轴为记录数。\",\n        \"en\": \"Counting {n} records that have an x value, in bins of {width}.\",\n    },\n    \"chart.no_data\": {\n        \"zh\": \"当前筛选条件下，没有可用于这组图表的数据。\",\n        \"en\": \"No data for this axis pair under the current filters.\",\n    },\n    \"chart.log_excluded\": {\n        \"zh\": \"Log 轴仅支持正数，已排除 {items}。\",\n        \"en\": \"Log axes take positive values only; excluded {items}.\",\n    },\n    \"chart.log_excluded_x\": {\"zh\": \"横轴 {n} 条\", \"en\": \"{n} on the x axis\"},\n    \"chart.log_excluded_y\": {\"zh\": \"纵轴 {n} 条\", \"en\": \"{n} on the y axis\"},\n    \"chart.bin_center\": {\"zh\": \"{axis}（Bin 中点）\", \"en\": \"{axis} (bin centre)\"},\n    \"chart.bin_mean\": {\"zh\": \"{axis}（Bin 平均值）\", \"en\": \"{axis} (bin mean)\"},\n    \"chart.binned_caption\": {\n        \"zh\": \"{n} 条记录合成为 {bins} 个 Bin；区间按左闭右开计算，\"\n              \"点位为 Bin 中点和纵轴均值，误差棒为{error}。\",\n        \"en\": \"{n} records collapsed into {bins} bins, each half-open; points \"\n              \"sit at the bin centre and the mean y, with {error} as the bars.\",\n    },\n    \"chart.binned_single\": {\n        \"zh\": \" 其中 {n} 个 Bin 仅有一条记录，不绘制误差棒。\",\n        \"en\": \" {n} bins hold a single record and get no bar.\",\n    },\n    \"chart.binned_nonpositive\": {\n        \"zh\": \" 另有 {n} 个误差棒下界不为正，无法在 Log 纵轴显示。\",\n        \"en\": \" Another {n} bars have a non-positive lower bound and cannot be \"\n              \"drawn on a log y axis.\",\n    },\n    \"tooltip.bin_start\": {\"zh\": \"Bin 起点\", \"en\": \"Bin start\"},\n    \"tooltip.bin_end\": {\"zh\": \"Bin 终点（不含）\", \"en\": \"Bin end (exclusive)\"},\n    \"tooltip.sample\": {\"zh\": \"样本数\", \"en\": \"Sample size\"},\n    \"tooltip.y_mean\": {\"zh\": \"纵轴均值\", \"en\": \"Mean y\"},\n    \"tooltip.range_start\": {\"zh\": \"区间起点\", \"en\": \"Range start\"},\n    \"tooltip.range_end\": {\"zh\": \"区间终点\", \"en\": \"Range end\"},\n\n    # --- detail tab -----------------------------------------------------\n    \"main.download\": {\n        \"zh\": \"导出 CSV (金额单位: 万欧)\", \"en\": \"Download CSV (money in 10k €)\",\n    },\n\n    # --- club tab -------------------------------------------------------\n    \"clubs.none\": {\n        \"zh\": \"当前筛选条件下没有可选择的俱乐部。\",\n        \"en\": \"No clubs available under the current filters.\",\n    },\n    \"clubs.select\": {\"zh\": \"查看俱乐部\", \"en\": \"Club\"},\n    \"clubs.buy_scale\": {\"zh\": \"买入费 Scale\", \"en\": \"Buy fee scale\"},\n    \"clubs.sell_scale\": {\"zh\": \"卖出费 Scale\", \"en\": \"Sell fee scale\"},\n    \"clubs.caption\": {\n        \"zh\": \"{club}：图中显示 {n} 条同时具有买入费和卖出费的记录。\",\n        \"en\": \"{club}: showing {n} records that have both a buy and a sell fee.\",\n    },\n    \"clubs.empty\": {\n        \"zh\": \"该俱乐部在当前筛选和 Scale 下没有可绘制的数据。\",\n        \"en\": \"Nothing to draw for this club under the current filters and scale.\",\n    },\n    \"clubs.log_excluded_buy\": {\"zh\": \"买入费 {n} 条\", \"en\": \"{n} on buy fee\"},\n    \"clubs.log_excluded_sell\": {\"zh\": \"卖出费 {n} 条\", \"en\": \"{n} on sell fee\"},\n\n    # --- money x pitch tab ----------------------------------------------\n    \"combo.needs_data\": {\n        \"zh\": \"买卖×表现需要表现数据。抓取完成后运行：\",\n        \"en\": \"This tab needs the performance tables. Once the crawl is done, run:\",\n    },\n    \"combo.caption\": {\n        \"zh\": \"筛选后 {total} 个转会周期中，{n} 个有场上数据\"\n              \"（缺的多为非五大联赛效力期）。金钱与表现均按整个效力期合计。\",\n        \"en\": \"{n} of the {total} filtered spells carry on-pitch data; the rest \"\n              \"are mostly spells outside the big five. Both money and \"\n              \"performance are totalled over the whole spell.\",\n    },\n    \"note.fb\": {\n        \"zh\": \"FBref 项仅联赛、高级项自 2017/18 起 —— 缺失为空，不是 0。\",\n        \"en\": \"FBref figures are league-only, and the advanced ones start in \"\n              \"2017/18. Missing means missing, not 0.\",\n    },\n    \"note.bl\": {\n        \"zh\": \"体能数据来自德甲官方，仅德甲效力期、自 2019/20 起 —— 其余为空，不是 0。\",\n        \"en\": \"Physical data comes from the Bundesliga's own feed: Bundesliga \"\n              \"spells from 2019/20 onward. Everything else is null, not 0.\",\n    },\n    \"note.cost_per_goal\": {\n        \"zh\": \"每球成本 = 买入费 ÷ 效力期总进球；0 球时为空，免签为 0。\",\n        \"en\": \"Cost per goal = buy fee ÷ goals in the spell. Null on zero \"\n              \"goals; 0 for a free signing.\",\n    },\n    \"note.goals_per_90\": {\n        \"zh\": \"每90分钟进球 = 总进球 ÷ 总分钟 × 90；0 分钟时为空。\",\n        \"en\": \"Goals per 90 = goals ÷ minutes × 90. Null on zero minutes.\",\n    },\n\n    # --- raw tab ---------------------------------------------------------\n    \"raw.caption\": {\n        \"zh\": \"原始事件表不受上方转会周期范围筛选影响。\",\n        \"en\": \"The raw event table ignores the spell filters above.\",\n    },\n\n    # --- data source ------------------------------------------------------\n    \"data.source\": {\"zh\": \"数据源\", \"en\": \"Data source\"},\n    \"data.upload\": {\"zh\": \"上传数据文件\", \"en\": \"Upload your data\"},\n    \"data.upload_help\": {\n        \"zh\": \"可以是 pipeline 产出的 scout.db，也可以是每张表一个 CSV（可一次选多个）、\"\n              \"打包好的 zip、JSON 或 Parquet。列名大小写、空格、连字符都不敏感。\"\n              \"文件只在本地解析，不会离开你的设备。\",\n        \"en\": \"The scout.db your pipeline produces, or one CSV per table \"\n              \"(select several at once), or a zip of them, or JSON or Parquet. \"\n              \"Header case, spaces and hyphens do not matter. Everything is \"\n              \"parsed locally and never leaves your device.\",\n    },\n    \"data.formats\": {\n        \"zh\": \"支持的格式：{formats}\",\n        \"en\": \"Accepted formats: {formats}\",\n    },\n    \"data.demo\": {\"zh\": \"载入样板数据\", \"en\": \"Load demo data\"},\n    \"data.demo_help\": {\n        \"zh\": \"一份程序生成的虚构数据集，用来试用界面。不含任何真实转会记录。\",\n        \"en\": \"A generated, fictional dataset for trying the interface out. It \"\n              \"contains no real transfer records.\",\n    },\n    \"data.using_demo\": {\n        \"zh\": \"正在使用样板数据。\",\n        \"en\": \"Using the demo data.\",\n    },\n    \"data.demo_banner\": {\n        \"zh\": \"⚠️ **样板数据 —— 全部为程序生成的虚构内容。**\"\n              \"俱乐部、球员、转会费都不是真的，任何数字都不能用来下结论。\"\n              \"换成你自己的文件请用左侧的数据源面板。\",\n        \"en\": \"⚠️ **Demo data - entirely generated and fictional.** The clubs, \"\n              \"players and fees are invented, so nothing here supports a \"\n              \"conclusion about anyone. Use the data source panel on the left \"\n              \"to load your own file.\",\n    },\n    \"data.using_local\": {\n        \"zh\": \"正在使用本地 `data/scout.db`。\",\n        \"en\": \"Using the local `data/scout.db`.\",\n    },\n    \"data.using_upload\": {\n        \"zh\": \"正在使用你上传的数据库。\",\n        \"en\": \"Using the database you uploaded.\",\n    },\n    \"data.welcome\": {\n        \"zh\": \"这个页面不附带任何数据 —— 它只是一个分析工具。\"\n              \"想先看看它能做什么，点“载入样板数据”；\"\n              \"要用自己的数据，在左侧上传符合下列结构的文件即可。\",\n        \"en\": \"This page ships with no data - it is only the analysis tool. \"\n              \"To see what it does, load the demo data; to use your own, \"\n              \"upload files with the structure below.\",\n    },\n    \"data.privacy\": {\n        \"zh\": \"文件在你的浏览器里解析，不会上传到任何服务器。\",\n        \"en\": \"The file is parsed in your own browser and is never uploaded \"\n              \"to any server.\",\n    },\n    \"data.schema\": {\"zh\": \"需要的表与列\", \"en\": \"Tables and columns required\"},\n    \"data.schema_optional\": {\n        \"zh\": \"可选（有则启用表现相关页签）：`spell_performance`\",\n        \"en\": \"Optional (enables the performance tabs): `spell_performance`\",\n    },\n    \"data.rejected\": {\"zh\": \"无法读取该文件\", \"en\": \"Could not read that file\"},\n\n    # --- performance tab -------------------------------------------------\n    \"perf.caption\": {\n        \"zh\": \"球员逐赛季场上数据（Transfermarkt + FBref）。\"\n              \"这里只做导出与覆盖率说明 —— 数据是拿去自己做关联分析用的。\",\n        \"en\": \"Per-season on-pitch data (Transfermarkt + FBref). This tab only \"\n              \"exports and reports coverage - the dataset is meant to be taken \"\n              \"away and analysed.\",\n    },\n    \"perf.not_built\": {\n        \"zh\": \"尚未生成。抓取完成后运行：\",\n        \"en\": \"Not built yet. Once the crawl is done, run:\",\n    },\n    \"perf.total\": {\"zh\": \"转会周期总数\", \"en\": \"Spells in total\"},\n    \"perf.covered\": {\"zh\": \"其中有表现数据\", \"en\": \"…with performance data\"},\n    \"perf.covered_help\": {\n        \"zh\": \"缺的多为非五大联赛俱乐部的效力期 —— FBref 与 TM 的覆盖都止于五大联赛。\",\n        \"en\": \"The gaps are mostly spells outside the big five; both sources \"\n              \"stop there.\",\n    },\n    \"perf.rate\": {\"zh\": \"覆盖率\", \"en\": \"Coverage\"},\n    \"perf.wide_label\": {\n        \"zh\": \"宽表：球员 × 俱乐部 × 赛季 × 赛事\",\n        \"en\": \"Wide table: player × club × season × competition\",\n    },\n    \"perf.spell_label\": {\n        \"zh\": \"汇总：每个转会周期一行\", \"en\": \"Summary: one row per spell\",\n    },\n    \"perf.download\": {\"zh\": \"下载 {label} (CSV)\", \"en\": \"Download {label} (CSV)\"},\n    \"perf.not_exported\": {\n        \"zh\": \"{label}：尚未导出，运行 `python -m scout.export`\",\n        \"en\": \"{label}: not exported yet, run `python -m scout.export`\",\n    },\n}\n\n\ndef translator(lang):\n    \"\"\"Return `t(key, **fmt)` bound to one language.\"\"\"\n    def t(key, **fmt):\n        entry = STRINGS[key]\n        text = entry.get(lang) or entry[DEFAULT_LANGUAGE]\n        return text.format(**fmt) if fmt else text\n    return t\n\n\ndef labels(columns, lang):\n    \"\"\"Ordered {column: label} map for axis pickers and table headers.\n\n    Raises on a column with no entry rather than falling back to the raw name:\n    a bare `fb_PrgC_Progression` on an axis is a bug, not a graceful default.\n    \"\"\"\n    return {name: STRINGS[f\"col.{name}\"][lang] for name in columns}\n",
 "scout/model/chart.py": "\"\"\"Pure data transformations used by the interactive charts.\"\"\"\n\nimport numpy as np\nimport pandas as pd\n\n\nERROR_BAR_FACTORS = {\n    \"std\": \"std\",\n    \"sem\": \"sem\",\n    \"ci95\": \"ci95\",\n}\n\n# A straight line in data space bends on a log axis, so a two-point segment\n# would be drawn in the wrong place. Sampling turns it back into something\n# Altair's straight fills can follow.\n_LINEAR_SAMPLES = 64\n\n\ndef vertical(value, label=None):\n    return {\"kind\": \"vertical\", \"value\": float(value),\n            \"label\": label or f\"x = {value:g}\"}\n\n\ndef horizontal(value, label=None):\n    return {\"kind\": \"horizontal\", \"value\": float(value),\n            \"label\": label or f\"y = {value:g}\"}\n\n\ndef linear(slope, intercept, label=None):\n    if label is None:\n        terms = \"x\" if slope == 1 else (\"-x\" if slope == -1 else f\"{slope:g}x\")\n        label = f\"y = {terms}\" + (f\" + {intercept:g}\" if intercept else \"\")\n    return {\"kind\": \"linear\", \"slope\": float(slope),\n            \"intercept\": float(intercept), \"label\": label}\n\n\ndef symlog_ticks(low, high, base=10):\n    \"\"\"Signed decade ticks for a symlog axis, plus zero.\n\n    Vega derives symlog ticks linearly over the *untransformed* domain, so a\n    range like -18000..11300 puts them at roughly -15000, -10000, -5000, 0,\n    5000, 10000 - nothing at all between 0 and 5000. But symlog places 100 a\n    quarter of the way up that axis, so the band holding most of the points\n    ends up with no gridline or label anywhere near it, and a reader cannot\n    tell -100 from 100. Labelling every decade on both sides fixes that, and\n    makes the sign readable at a glance.\n    \"\"\"\n    limit = max(abs(float(low)), abs(float(high)))\n    magnitudes, step = [], 1\n    while step <= limit:\n        magnitudes.append(step)\n        step *= base\n\n    ticks = [-m for m in reversed(magnitudes)] + [0] + magnitudes\n    return [t for t in ticks if low <= t <= high]\n\n\ndef build_reference_lines(specs, x_bounds, y_bounds, x_log=False, y_log=False):\n    \"\"\"Materialise reference lines as two-column frames spanning the plot.\n\n    Returns (drawable, dropped). A log axis cannot show anything at or below\n    zero, so a line that would land there is reported as dropped rather than\n    clipped to a position it does not actually occupy - a mispositioned\n    reference line is worse than an absent one, because it still gets read.\n    \"\"\"\n    x_lo, x_hi = (float(b) for b in x_bounds)\n    y_lo, y_hi = (float(b) for b in y_bounds)\n\n    drawable, dropped = [], []\n    for spec in specs:\n        frame = _materialise(spec, x_lo, x_hi, y_lo, y_hi, x_log, y_log)\n        if frame is None or frame.empty:\n            dropped.append(spec[\"label\"])\n        else:\n            drawable.append((spec[\"label\"], frame))\n    return drawable, dropped\n\n\ndef _materialise(spec, x_lo, x_hi, y_lo, y_hi, x_log, y_log):\n    kind = spec[\"kind\"]\n\n    if kind == \"vertical\":\n        x = spec[\"value\"]\n        if x_log and x <= 0:\n            return None\n        return pd.DataFrame({\"_x\": [x, x], \"_y\": [y_lo, y_hi]})\n\n    if kind == \"horizontal\":\n        y = spec[\"value\"]\n        if y_log and y <= 0:\n            return None\n        return pd.DataFrame({\"_x\": [x_lo, x_hi], \"_y\": [y, y]})\n\n    if kind != \"linear\":\n        raise ValueError(f\"unknown reference line kind: {kind}\")\n\n    xs = np.linspace(x_lo, x_hi, _LINEAR_SAMPLES)\n    ys = spec[\"slope\"] * xs + spec[\"intercept\"]\n    keep = np.ones(len(xs), dtype=bool)\n    if x_log:\n        keep &= xs > 0\n    if y_log:\n        keep &= ys > 0\n    # Two surviving points is the minimum that still draws as a line.\n    if keep.sum() < 2:\n        return None\n    return pd.DataFrame({\"_x\": xs[keep], \"_y\": ys[keep]})\n\n\ndef aggregate_scatter_bins(frame, x_column, y_column, bin_size, error_mode):\n    \"\"\"Aggregate scatter points into fixed-width x bins.\n\n    The composite point sits at the bin midpoint and the mean y value. Error\n    bars describe y dispersion/uncertainty; a one-record bin has no error bar.\n    Bin intervals are left-closed and right-open.\n    \"\"\"\n    if bin_size <= 0:\n        raise ValueError(\"bin_size must be positive\")\n    if error_mode not in ERROR_BAR_FACTORS:\n        raise ValueError(f\"unknown error mode: {error_mode}\")\n\n    columns = list(dict.fromkeys([x_column, y_column]))\n    data = frame[columns].dropna(subset=columns).copy()\n    if data.empty:\n        return pd.DataFrame(\n            columns=[\n                \"bin_start\", \"bin_end\", \"x_center\", \"y_mean\", \"count\",\n                \"y_std\", \"error\", \"error_low\", \"error_high\",\n            ]\n        )\n\n    data[\"_bin_start\"] = (\n        np.floor(data[x_column] / bin_size) * bin_size\n    ).round(10)\n    summary = (\n        data.groupby(\"_bin_start\", as_index=False)\n        .agg(\n            y_mean=(y_column, \"mean\"),\n            count=(y_column, \"size\"),\n            y_std=(y_column, \"std\"),\n        )\n        .rename(columns={\"_bin_start\": \"bin_start\"})\n    )\n    summary[\"bin_end\"] = (summary[\"bin_start\"] + bin_size).round(10)\n    summary[\"x_center\"] = (\n        summary[\"bin_start\"] + (bin_size / 2)\n    ).round(10)\n\n    if error_mode == \"std\":\n        summary[\"error\"] = summary[\"y_std\"]\n    elif error_mode == \"sem\":\n        summary[\"error\"] = summary[\"y_std\"] / np.sqrt(summary[\"count\"])\n    else:\n        summary[\"error\"] = (\n            1.96 * summary[\"y_std\"] / np.sqrt(summary[\"count\"])\n        )\n\n    summary[\"error_low\"] = summary[\"y_mean\"] - summary[\"error\"]\n    summary[\"error_high\"] = summary[\"y_mean\"] + summary[\"error\"]\n    return summary\n\n\ndef parse_number_list(text):\n    \"\"\"Split a comma-separated box into floats, reporting what did not parse.\n\n    A full-width comma (U+FF0C) counts as a separator: it is what a Chinese\n    keyboard produces, and rejecting it would look like the field is broken.\n\n    Bad input is returned rather than dropped - silently ignoring a typo would\n    leave the reader waiting for a line that never arrives.\n    \"\"\"\n    values, bad = [], []\n    for chunk in str(text).replace(\"，\", \",\").split(\",\"):\n        chunk = chunk.strip()\n        if not chunk:\n            continue\n        try:\n            values.append(float(chunk))\n        except ValueError:\n            bad.append(chunk)\n    return values, bad\n",

 "scout/model/metrics.py": "\"\"\"Derive profit and return multiple from spells. See spec 4.5.\"\"\"\nimport numpy as np\nimport pandas as pd\n\n\ndef add_metrics(spells):\n    df = spells.copy()\n\n    if df.empty:\n        for column in (\n            \"profit\", \"roi_mult\", \"age_diff\", \"buy_value_gap\", \"sell_value_gap\"\n        ):\n            df[column] = pd.Series(dtype=float)\n        return df\n\n    buy = pd.to_numeric(df[\"buy_fee\"], errors=\"coerce\")\n    sell = pd.to_numeric(df[\"sell_fee\"], errors=\"coerce\")\n\n    # NaN propagates: an undisclosed or missing fee yields NaN, never 0.\n    df[\"profit\"] = sell - buy\n\n    # A free or youth arrival has buy_fee == 0, which would divide by zero.\n    df[\"roi_mult\"] = np.where(buy > 0, sell / buy.replace(0, np.nan), np.nan)\n\n    missing = pd.Series(np.nan, index=df.index, dtype=float)\n    buy_age = pd.to_numeric(df.get(\"buy_age\", missing), errors=\"coerce\")\n    sell_age = pd.to_numeric(df.get(\"sell_age\", missing), errors=\"coerce\")\n    df[\"age_diff\"] = sell_age - buy_age\n\n    # How far the agreed fee sat from Transfermarkt's valuation at the time.\n    # Positive means the club transacted below the listed value: a bargain on\n    # the way in, money left on the table on the way out. Both sides use the\n    # same direction so the sign means one thing throughout.\n    #\n    # NaN propagates as it does for profit. A fee of 0 is a real price and\n    # yields a real gap; a missing or undisclosed fee yields NaN, never the\n    # full market value.\n    buy_mv = pd.to_numeric(df.get(\"buy_market_value\", missing), errors=\"coerce\")\n    sell_mv = pd.to_numeric(df.get(\"sell_market_value\", missing), errors=\"coerce\")\n    df[\"buy_value_gap\"] = buy_mv - buy\n    df[\"sell_value_gap\"] = sell_mv - sell\n\n    return df\n\n\ndef add_perf_metrics(rows):\n    \"\"\"Derive money-per-output ratios on spell_performance rows.\n\n    Every zero denominator yields NaN, never inf or 0: zero goals means the\n    cost per goal is undefined, and 0/0 minutes says nothing about scoring\n    rate. The one real zero is a free signing's cost_per_goal - a fee of 0 is\n    a price, so goals genuinely came free.\n    \"\"\"\n    df = rows.copy()\n\n    if df.empty:\n        for column in (\"cost_per_goal\", \"goals_per_90\"):\n            df[column] = pd.Series(dtype=float)\n        return df\n\n    buy = pd.to_numeric(df[\"buy_fee\"], errors=\"coerce\")\n    goals = pd.to_numeric(df[\"tm_goals\"], errors=\"coerce\")\n    minutes = pd.to_numeric(df[\"tm_minutes\"], errors=\"coerce\")\n\n    df[\"cost_per_goal\"] = buy / goals.where(goals > 0)\n    df[\"goals_per_90\"] = goals / minutes.where(minutes > 0) * 90\n\n    return df\n",
 "scout/store/db.py": "\"\"\"SQLite persistence. Thin wrapper over pandas to_sql/read_sql.\"\"\"\nimport sqlite3\nfrom pathlib import Path\n\nimport pandas as pd\n\nDEFAULT_DB = Path(\"data/scout.db\")\n\n\ndef init_db(db_path=DEFAULT_DB):\n    db_path = Path(db_path)\n    db_path.parent.mkdir(parents=True, exist_ok=True)\n    sqlite3.connect(db_path).close()\n    return db_path\n\n\ndef save_table(df, table, db_path=DEFAULT_DB):\n    with sqlite3.connect(Path(db_path)) as conn:\n        df.to_sql(table, conn, if_exists=\"replace\", index=False)\n\n\ndef load_table(table, db_path=DEFAULT_DB):\n    with sqlite3.connect(Path(db_path)) as conn:\n        try:\n            return pd.read_sql(f\"SELECT * FROM {table}\", conn)\n        except pd.errors.DatabaseError:\n            return pd.DataFrame()\n",

 "scout/store/demo.py": "\"\"\"A synthetic dataset, so the published page has something to show.\n\nEvery club, player and fee in here is invented. That is not a stylistic\nchoice: the page may not carry an extract of the real database (see\ndocs/PUBLISHING.md), and a demo built from real rows would be exactly that.\nGenerating the data instead keeps the bundle to source code and keeps the\nclaim \"this page ships no data\" literally true.\n\nIt is still a demo of *this* app, so it goes through the same schema and the\nsame loader as an uploaded file, and it reproduces the shape of the real\nthing rather than an idealised version of it:\n\n  - undisclosed fees are null, and take profit and multiple with them\n  - players still at the club have no sale at all\n  - expected goals start in 2017/18, because upstream has nothing earlier\n  - distance covered exists only for the Bundesliga, from 2019/20\n\nA demo that quietly filled those gaps would teach the wrong thing about the\ndataset. Seeded, so everyone looking at the page sees the same numbers.\n\"\"\"\nimport numpy as np\nimport pandas as pd\n\nfrom scout.constants import LEAGUES\n\nSEED = 20260729\n# Nothing is stored, so this costs bundle size nothing - only a few\n# milliseconds of arithmetic when the page opens.\nN_SPELLS = 1500\nSEASONS = [f\"{year}/{str(year + 1)[2:]}\" for year in range(2015, 2025)]\n\n# --- calibration -------------------------------------------------------\n#\n# The rows are invented; their distributions are not. Every constant below is\n# an aggregate moment measured over the real 22,063-spell database by\n# tools/calibrate_demo.py - a median, a spread, a proportion, a correlation.\n#\n# Aggregate moments are analysis of facts, which is publishable in a way an\n# extract is not: you cannot recover a single transfer from a standard\n# deviation. The line held here is distribution-level only - no club, player,\n# season or individual deal, and nothing broken down finely enough to identify\n# one. See docs/PUBLISHING.md.\n#\n# Making these up instead was the alternative, and a worse one: invented\n# quantiles teach a market that does not exist. Several were badly wrong when\n# guessed - undisclosed fees are 46% of the data, not the 13% that felt right.\n# Medians and quartile spreads throughout, never means and standard\n# deviations. Fees are not lognormal - their log is itself right-skewed - so a\n# generator built on mean-of-log invents a market where the typical deal costs\n# EUR 3.4m instead of EUR 0.5m.\nFEE_LOG_MEAN = 15.137        # of paid arrivals; free ones are counted below\nFEE_LOG_SD = 1.446\nFEE_CEILING = 2.22e8         # largest fee in the data\nFREE_ARRIVAL_RATE = 0.427    # of disclosed fees, exactly zero: a free signing\n# ...but it depends heavily on how the spell ends. A player sold on rarely\n# arrived free; one who is still at the club usually did. Drawn independently\n# instead, nearly half of every priced arrival ends in a zero sale and the\n# median return multiple lands at a third of the real one.\n#\n# Every outcome is listed rather than defaulting the quiet ones to the overall\n# rate: transfers pull that average down, so the rest sit above it, and the\n# default produced a quarter too few free arrivals. The median fee sits right\n# at the edge of the pile of zeros, so that alone moved it by a factor of three.\nFREE_ARRIVAL_BY_OUTCOME = {\n    \"still_here\": 0.514,\n    \"transfer\": 0.133,\n    \"free\": 0.436,\n    \"no_fee\": 0.517,\n    \"undisclosed\": 0.366,\n}\n# Whether a fee is published depends on the outcome too, and far more strongly\n# than expected - a player still at the club has a known fee nine times in ten,\n# a player sold on only a third of the time. Applied as one flat rate, the\n# disclosed subset carries the wrong outcome mix and the free-arrival rates\n# above then average to the wrong marginal.\nUNDISCLOSED_BY_OUTCOME = {\n    \"still_here\": 0.094,\n    \"transfer\": 0.655,\n    \"free\": 0.699,\n    \"no_fee\": 0.646,\n    \"undisclosed\": 0.778,\n}\nMULTIPLE_LOG_MEAN = 0.033\nMULTIPLE_LOG_SD = 1.043\nUNDISCLOSED_RATE = 0.463\nHOLD_YEARS_MEAN = 2.501\nBUY_AGE_MEAN = 25.26\nBUY_AGE_SD = 4.47\nMINUTES_SHARE_MEAN = 0.399\nMINUTES_SHARE_SD = 0.307\nMATCHED_RATE = 0.868         # of big-five spells with a disclosed fee\nFEE_GOAL_CORRELATION = 0.271\nGOALLESS_RATE = 0.249        # of regulars: defenders, keepers, squad players\nDISTANCE_PER90_MEAN = 10.89\nDISTANCE_PER90_SD = 1.09     # IQR-based; the raw sd is inflated by short spells\n\n# Marks the tables as synthetic. It travels on the frame rather than in the\n# caller, so whatever loads the data can still say so on screen.\nDEMO_FLAG = \"scout_demo\"\n\n# Invented. Two halves crossed so a handful of parts cover a whole league\n# system, and no combination lands on a club that exists.\n_CLUB_HEADS = (\n    \"Riverbend\", \"Kestrel\", \"Nordhavn\", \"Ashcombe\", \"Vallemar\", \"Steinbach\",\n    \"Portmere\", \"Calderon\", \"Windhoek\", \"Lindqvist\", \"Brackwater\", \"Osterfeld\",\n    \"Montclair\", \"Fensholt\",\n)\n_CLUB_TAILS = (\"Athletic\", \"United\", \"Sporting\", \"City\", \"Rovers\", \"Olympic\")\n\n# Syllables, not names. Assembled into surnames that read like surnames and\n# are not anybody's.\n_HEADS = (\"Mar\", \"Kol\", \"Bren\", \"Tas\", \"Vil\", \"Dor\", \"Sen\", \"Ash\", \"Rok\",\n          \"Fen\", \"Lud\", \"Nak\", \"Pel\", \"Osk\", \"Tir\", \"Zan\", \"Hal\", \"Ime\")\n_MIDS = (\"\", \"\", \"a\", \"en\", \"ir\", \"os\", \"ul\", \"ande\", \"eri\")\n_TAILS = (\"ven\", \"sky\", \"dal\", \"ton\", \"ric\", \"mo\", \"nen\", \"kow\", \"las\", \"ard\",\n          \"iss\", \"uru\", \"berg\", \"eau\")\n_INITIALS = tuple(\"ABDEFGHJKLMNOPRSTVZ\")\n\nCLUB_NAMES = tuple(f\"{head} {tail}\" for head in _CLUB_HEADS for tail in _CLUB_TAILS)\n\n# Measured, not estimated. The shares are nothing like the intuitive ones:\n# more than a third of spells never end in a sale at all, and free transfers\n# outnumber undisclosed fees six to one.\n_OUTCOMES = {\n    \"still_here\": 0.3663,\n    \"transfer\": 0.3078,\n    \"free\": 0.2289,\n    \"no_fee\": 0.0591,\n    \"undisclosed\": 0.0374,\n    \"unknown_exit\": 0.0004,\n}\n\n# (median per full season played, sigma of log) for every column\n# summarise_spells totals up. Both measured over regulars - a player with 200\n# minutes has a per-90 rate built on almost nothing, and those rows swamp the\n# spread without describing anyone's season.\n#\n# sigma is the spread of log(rate), because the draw below is\n# median * exp(N(0, sigma)). Feeding a relative IQR in here instead overstates\n# the tail several-fold, which is how the first version produced a 480-xG\n# season.\n_STAT_RATES = {\n    \"tm_yellow\": (6.00, 0.61), \"tm_red\": (0.00, 0.79),\n    \"fb_xg\": (1.96, 1.26), \"fb_npxg\": (1.90, 1.21), \"fb_xag\": (1.96, 1.09),\n    \"fb_shots\": (25.98, 1.00), \"fb_shots_on_target\": (7.89, 1.18),\n    \"fb_key_passes\": (21.36, 1.02),\n    \"fb_prog_passes\": (92.31, 0.59), \"fb_prog_carries\": (37.53, 0.89),\n    \"fb_prog_receptions\": (83.28, 1.45),\n    \"fb_touches\": (1372.21, 0.51), \"fb_dribbles_won\": (15.11, 1.10),\n    \"fb_carry_distance\": (3954.01, 0.58),\n    \"fb_tackles\": (35.88, 0.78), \"fb_tackles_won\": (21.70, 0.76),\n    \"fb_interceptions\": (24.62, 0.99), \"fb_blocks\": (24.85, 0.64),\n    \"fb_clearances\": (29.22, 1.14), \"fb_aerials_won\": (26.64, 1.06),\n    \"fb_fouls\": (34.10, 0.54), \"fb_fouled\": (26.74, 0.80),\n    \"fb_recoveries\": (120.84, 0.72),\n    # Keepers only, and measured over the 451 keeper spells rather than all.\n    \"fb_saves\": (89.33, 0.34), \"fb_goals_against\": (43.73, 0.43),\n    \"fb_clean_sheets\": (7.29, 0.39),\n}\n\n# Goals and assists are drawn from a Poisson rather than the lognormal the\n# loop below applies, so they sit outside _STAT_RATES - putting them in it\n# would overwrite the draw with a second one. Same measurement, per full\n# season played.\nGOALS_PER_SEASON = 3.50      # scorers only; the rest are zeroed outright\nASSISTS_PER_SEASON = 2.46\n\n_KEEPER_STATS = (\"fb_saves\", \"fb_goals_against\", \"fb_clean_sheets\")\n\n# How hard the latent quality term pushes goals. The only number here that is\n# not measured: it is the knob turned until the generated fee-to-goals\n# correlation lands on the measured FEE_GOAL_CORRELATION, which a test then\n# checks so it cannot drift out of range unnoticed.\n_GOALS_LOAD = 0.22\n\n# 451 keeper spells in 22,063.\n_KEEPER_RATE = 451 / 22063\n\n# Minutes in a league season, the denominator every rate above is quoted per.\n_SEASON_MINUTES = 3060.0\n\n_XG_FROM = \"2017/18\"      # upstream has nothing earlier\n_PHYSICAL_FROM = \"2019/20\"  # the Bundesliga API starts here\n\n\ndef is_demo(tables):\n    \"\"\"Whether these tables came from the generator rather than a real file.\"\"\"\n    spells = tables.get(\"spells\")\n    return spells is not None and bool(spells.attrs.get(DEMO_FLAG, False))\n\n\ndef demo_tables():\n    \"\"\"The whole synthetic dataset, in the shape read_upload returns.\"\"\"\n    rng = np.random.default_rng(SEED)\n    spells = _spells(rng)\n    tables = {\n        \"spells\": spells,\n        \"transfers\": _transfers(spells),\n        \"spell_performance\": _performance(rng, spells),\n    }\n    for frame in tables.values():\n        frame.attrs[DEMO_FLAG] = True\n    return tables\n\n\ndef _spells(rng):\n    n = N_SPELLS\n    club = rng.choice(CLUB_NAMES, n)\n    # A club sits in one league for good, so the league follows the club rather\n    # than being drawn again - otherwise the club tab shows one side in five.\n    league_of = {\n        name: list(LEAGUES)[i % len(LEAGUES)] for i, name in enumerate(CLUB_NAMES)\n    }\n\n    # One latent \"how good is this player\" drives fee, sale price and output\n    # together. Without it the scatter plots are noise and demo nothing.\n    quality = rng.normal(0, 1, n)\n\n    buy_idx = rng.integers(0, len(SEASONS) - 1, n)\n    hold = np.clip(rng.geometric(1 / HOLD_YEARS_MEAN, n), 1, len(SEASONS) - 1)\n    sell_idx = np.minimum(buy_idx + hold, len(SEASONS) - 1)\n    hold = sell_idx - buy_idx\n\n    buy_age = np.clip(\n        rng.normal(BUY_AGE_MEAN, BUY_AGE_SD, n), 16, 38\n    ).round().astype(int)\n\n    # The measured spread is split between the latent quality term and the\n    # residual so that the marginal still comes out at FEE_LOG_SD - a fixed\n    # half of the variance each, deliberately not a function of _GOALS_LOAD.\n    # Tying the split to that knob made it move the fee distribution as well as\n    # the correlation, and tuning one to target sent the median fee across a\n    # tenfold range. Clipped as well as shaped: a lognormal tail left to run\n    # produces a half-billion-euro signing, and one absurd point is all it takes\n    # for a demo scatter plot to read as broken.\n    quality_share = FEE_LOG_SD * np.sqrt(0.5)\n    residual = FEE_LOG_SD * np.sqrt(0.5)\n    paid = np.clip(\n        np.exp(FEE_LOG_MEAN + rng.normal(0, residual, n) + quality_share * quality),\n        5e4, FEE_CEILING,\n    )\n    # Proportions are measured and so do not sum to exactly one.\n    weights = np.array(list(_OUTCOMES.values()))\n    outcome = rng.choice(list(_OUTCOMES), n, p=weights / weights.sum())\n    sold = outcome == \"transfer\"\n    held = outcome == \"still_here\"\n\n    # A free signing is a fee of exactly zero - a price that was paid, not a\n    # price that is unknown. Both exist in this column and the app treats them\n    # very differently, so the demo has to produce both. The rate is conditioned\n    # on the outcome, which is why it is drawn after it.\n    free_rate = np.array([\n        FREE_ARRIVAL_BY_OUTCOME.get(code, FREE_ARRIVAL_RATE) for code in outcome\n    ])\n    paid = np.where(rng.random(n) < free_rate, 0.0, paid)\n\n    # Measured: the median sale runs a little above the purchase price, and the\n    # spread around that dwarfs the drift. Age still costs.\n    multiple = np.exp(\n        rng.normal(MULTIPLE_LOG_MEAN, MULTIPLE_LOG_SD, n)\n        - 0.05 * np.maximum(buy_age - 26, 0)\n    )\n    sell_fee = np.where(sold, np.clip(paid * multiple, 0, FEE_CEILING), np.nan)\n    sell_fee = np.where(outcome == \"free\", 0.0, sell_fee)\n\n    # Market value is public even when the fee is not, so it is derived from\n    # what was actually paid and survives the blinding below.\n    # Clipped for the same reason the fees are: valuations are drawn around a\n    # fee, so an unclipped multiplier walks straight back over the ceiling.\n    buy_mv = np.clip(paid * np.exp(rng.normal(0.05, 0.4, n)), 0, FEE_CEILING)\n    sell_mv = np.where(\n        held, np.nan,\n        np.clip(sell_fee * np.exp(rng.normal(0.1, 0.45, n)), 0, FEE_CEILING),\n    )\n\n    # An undisclosed fee is missing, not zero, and it is nearly half the data -\n    # the single biggest caveat the app exists to respect, and the one a\n    # guessed rate got most wrong.\n    blind_rate = np.array([\n        UNDISCLOSED_BY_OUTCOME.get(code, UNDISCLOSED_RATE) for code in outcome\n    ])\n    buy_fee = np.where(rng.random(n) < blind_rate, np.nan, paid)\n\n    frame = pd.DataFrame({\n        \"spell_id\": [f\"demo-{i:04d}\" for i in range(n)],\n        \"player_name\": _player_names(rng, n),\n        \"club_name\": club,\n        \"league\": [league_of[c] for c in club],\n        \"buy_season\": [SEASONS[i] for i in buy_idx],\n        \"sell_season\": np.where(held, None, [SEASONS[i] for i in sell_idx]),\n        \"buy_fee\": buy_fee,\n        \"sell_fee\": sell_fee,\n        \"sell_type\": outcome,\n        \"is_realized\": (~held).astype(int),\n        \"buy_age\": buy_age,\n        \"sell_age\": np.where(held, np.nan, buy_age + hold),\n        \"hold_years\": np.where(held, np.nan, hold),\n        \"buy_market_value\": buy_mv,\n        \"sell_market_value\": sell_mv,\n    })\n    frame[\"age_diff\"] = frame[\"sell_age\"] - frame[\"buy_age\"]\n    # Both sides have to be known. NaN propagates on its own; the point is that\n    # nothing here quietly substitutes a zero.\n    frame[\"profit\"] = frame[\"sell_fee\"] - frame[\"buy_fee\"]\n    frame[\"roi_mult\"] = frame[\"sell_fee\"] / frame[\"buy_fee\"].where(frame[\"buy_fee\"] > 0)\n    frame[\"buy_value_gap\"] = frame[\"buy_fee\"] - frame[\"buy_market_value\"]\n    frame[\"sell_value_gap\"] = frame[\"sell_fee\"] - frame[\"sell_market_value\"]\n    return frame\n\n\ndef _player_names(rng, n):\n    \"\"\"An initial and an invented surname - a chart label, not a person.\"\"\"\n    initial = rng.choice(_INITIALS, n)\n    surname = np.char.add(\n        np.char.add(rng.choice(_HEADS, n), rng.choice(_MIDS, n)),\n        rng.choice(_TAILS, n),\n    )\n    return [f\"{i}. {s}\" for i, s in zip(initial, surname)]\n\n\ndef _transfers(spells):\n    \"\"\"The raw ledger the app shows in its last tab: one row per movement.\"\"\"\n    buys = pd.DataFrame({\n        \"player_name\": spells[\"player_name\"],\n        \"fee_eur\": spells[\"buy_fee\"],\n        \"mv_at_time_eur\": spells[\"buy_market_value\"],\n        \"age\": spells[\"buy_age\"],\n    })\n    sales = pd.DataFrame({\n        \"player_name\": spells[\"player_name\"],\n        \"fee_eur\": spells[\"sell_fee\"],\n        \"mv_at_time_eur\": spells[\"sell_market_value\"],\n        \"age\": spells[\"sell_age\"],\n    }).dropna(subset=[\"age\"])\n    return pd.concat([buys, sales], ignore_index=True)\n\n\ndef _performance(rng, spells):\n    \"\"\"Per-spell on-pitch totals, merged onto the spells the app filters.\"\"\"\n    n = len(spells)\n    seasons = spells[\"hold_years\"].fillna(2).clip(lower=1).to_numpy()\n\n    # Not everyone is matched to a performance row, and the app has a state for\n    # the rest.\n    matched = rng.random(n) < MATCHED_RATE\n\n    # Share of available minutes, from the measured mean and spread. Solved for\n    # Beta rather than assumed: with a mean below a half and a spread that\n    # wide, the real shape has mass piled at both ends - squad players and\n    # ever-presents - which a bell curve would smooth away.\n    common = max(\n        MINUTES_SHARE_MEAN * (1 - MINUTES_SHARE_MEAN) / MINUTES_SHARE_SD ** 2 - 1,\n        0.1,\n    )\n    share = rng.beta(MINUTES_SHARE_MEAN * common, (1 - MINUTES_SHARE_MEAN) * common, n)\n\n    # Better players play more, which is what makes fee and output correlate.\n    # .where(> 0) before the log, not just fillna: a free signing's fee is a\n    # legitimate zero, and log(0) is -inf, which clips every free arrival to\n    # the minimum share and empties half the demo's minutes column.\n    fee = pd.to_numeric(spells[\"buy_fee\"], errors=\"coerce\")\n    quality = np.log(fee.where(fee > 0).fillna(fee[fee > 0].median())) - FEE_LOG_MEAN\n    share = np.clip(share + 0.05 * quality, 0.03, 1.0)\n\n    apps = np.round(seasons * 34 * share).clip(1)\n    minutes = np.round(apps * rng.uniform(48, 88, n))\n    played = minutes / _SEASON_MINUTES\n    # Zero-inflated, because a quarter of regulars are defenders and keepers who\n    # never score. Without it every row has goals, cost-per-goal is never\n    # undefined, and the demo hides the null the app was built to handle.\n    #\n    # The inflation rate is solved for rather than applied as measured: a\n    # Poisson produces zeros of its own, and stacking the measured 25% on top of\n    # those overshoots by a third. Subtract what the draw already gives.\n    rate = np.clip(GOALS_PER_SEASON * played * np.exp(_GOALS_LOAD * quality), 0, 45)\n    # Solved over regulars, because that is the population GOALLESS_RATE was\n    # measured on. Averaging over everyone counts the bench, whose Poisson\n    # zeros are far more common, and the correction then overshoots.\n    regular = minutes > 900\n    from_poisson = float(np.nanmean(np.exp(-rate[regular]))) if regular.any() else 0.0\n    inflate = max((GOALLESS_RATE - from_poisson) / max(1 - from_poisson, 1e-6), 0.0)\n    goals = rng.poisson(rate) * (rng.random(n) >= inflate)\n    assists = rng.poisson(np.clip(ASSISTS_PER_SEASON * played, 0, 30))\n\n    perf = pd.DataFrame({\n        \"spell_id\": spells[\"spell_id\"],\n        \"seasons\": seasons,\n        \"perf_rows\": seasons,\n        \"tm_apps\": apps,\n        \"tm_minutes\": minutes,\n        \"tm_goals\": goals.astype(float),\n        \"tm_assists\": assists.astype(float),\n    })\n    for column, (per_season, sigma) in _STAT_RATES.items():\n        scale = np.exp(rng.normal(0, sigma, n)) if sigma else np.ones(n)\n        perf[column] = np.round(per_season * played * scale, 2)\n\n    # Keepers only. Rather than model positions, give the goalkeeping columns to\n    # the measured share of spells and leave them null elsewhere - which is how\n    # they read in the real table anyway.\n    keeper = rng.random(n) < _KEEPER_RATE\n    for column in _KEEPER_STATS:\n        perf[column] = np.where(keeper, perf[column], np.nan)\n\n    perf.loc[~matched, perf.columns.drop(\"spell_id\")] = np.nan\n\n    out = spells.merge(perf, on=\"spell_id\", how=\"left\")\n    out[\"has_perf_data\"] = out[\"perf_rows\"].notna().astype(int)\n\n    # Expected goals do not exist before 2017/18 upstream, so they do not exist\n    # here either.\n    too_early = out[\"buy_season\"] < _XG_FROM\n    out.loc[too_early, [c for c in _STAT_RATES if c.startswith(\"fb_\")]] = np.nan\n\n    _add_physical(rng, out)\n    return out\n\n\ndef _add_physical(rng, out):\n    \"\"\"Distance covered: Bundesliga only, 2019/20 on. The gap is the point.\"\"\"\n    for column in (\"bl_distance_km\", \"bl_sprints\", \"bl_intensive_runs\",\n                   \"bl_top_speed_kmh\", \"bl_distance_per90\"):\n        out[column] = np.nan\n\n    covered = (\n        (out[\"league\"] == \"L1\")\n        & (out[\"buy_season\"] >= _PHYSICAL_FROM)\n        & out[\"tm_minutes\"].notna()\n    )\n    minutes = out.loc[covered, \"tm_minutes\"].to_numpy()\n    size = len(minutes)\n    if not size:\n        return\n    per90 = rng.normal(DISTANCE_PER90_MEAN, DISTANCE_PER90_SD, size)  # km\n    out.loc[covered, \"bl_distance_per90\"] = np.round(per90, 2)\n    out.loc[covered, \"bl_distance_km\"] = np.round(per90 * minutes / 90, 1)\n    out.loc[covered, \"bl_sprints\"] = np.round(minutes / 90 * rng.normal(22, 6, size))\n    out.loc[covered, \"bl_intensive_runs\"] = np.round(\n        minutes / 90 * rng.normal(58, 12, size)\n    )\n    out.loc[covered, \"bl_top_speed_kmh\"] = np.round(rng.normal(32.4, 1.5, size), 1)\n",
 "scout/store/formats.py": "\"\"\"Turn an uploaded file into tables, whatever shape it arrived in.\n\nThe app reads one thing - a few named tables - but people have that data in\nwhatever their last tool wrote: a database, a folder of CSVs zipped up, a\nspreadsheet export with semicolons and a byte order mark, a Parquet file from\na notebook. Refusing all but one of those is a real barrier for no reason,\nsince every format here decodes with the standard library or pandas alone.\nNothing is added to the page's requirements list, so nothing is downloaded.\n\nFormat is decided by content first and filename second. People rename files,\nand the magic bytes are not a matter of opinion.\n\nThe filename is used for one other thing: a member called `spells.csv` names\nits table. Anything else comes back under \"\" for the caller to route by its\ncolumns - see scout/store/source.py.\n\"\"\"\nimport csv\nimport gzip\nimport io\nimport json\nimport sqlite3\nimport tempfile\nimport zipfile\nfrom pathlib import Path\n\nimport pandas as pd\n\n# Offered in the uploader, and named in the error when nothing matches.\nSUFFIXES = [\n    \"db\", \"sqlite\", \"sqlite3\",\n    \"csv\", \"tsv\", \"txt\",\n    \"json\", \"parquet\", \"zip\", \"gz\",\n]\n\n_SQLITE_MAGIC = b\"SQLite format 3\\x00\"\n_ZIP_MAGIC = b\"PK\\x03\\x04\"\n_GZIP_MAGIC = b\"\\x1f\\x8b\"\n_PARQUET_MAGIC = b\"PAR1\"\n\n# Only these are worth pulling out of an archive; the rest is packaging.\n# Deliberately no \".txt\" - archives come with READMEs, and a directly uploaded\n# .txt is a choice in a way that one swept out of a zip is not.\n_ARCHIVE_SUFFIXES = (\".csv\", \".tsv\", \".json\", \".parquet\", \".db\",\n                     \".sqlite\", \".sqlite3\", \".gz\")\n\n_KNOWN_STEMS = {\"spells\", \"transfers\", \"spell_performance\"}\n\n\nclass UnknownFormat(Exception):\n    \"\"\"The bytes are not in any format this app can read.\"\"\"\n\n\ndef describe_formats():\n    return \", \".join(f\".{s}\" for s in SUFFIXES)\n\n\ndef decode(name, data):\n    \"\"\"(filename, bytes) -> {table name or \"\": DataFrame}.\"\"\"\n    if not data:\n        raise UnknownFormat(\n            f\"'{name}' is empty. Accepted formats: {describe_formats()}.\"\n        )\n\n    if data.startswith(_GZIP_MAGIC):\n        # Unwrap first: what is inside decides the format, and .csv.gz should\n        # behave exactly like .csv.\n        inner = Path(name).stem if name.lower().endswith(\".gz\") else name\n        return decode(inner, gzip.decompress(data))\n\n    if data.startswith(_SQLITE_MAGIC):\n        return _from_sqlite(data)\n    if data.startswith(_ZIP_MAGIC):\n        return _from_zip(data)\n    if data.startswith(_PARQUET_MAGIC):\n        return {_label(name): pd.read_parquet(io.BytesIO(data))}\n\n    text = _as_text(name, data)\n    stripped = text.lstrip()\n    if stripped.startswith((\"{\", \"[\")):\n        return _from_json(name, stripped)\n    return {_label(name): _from_delimited(name, text)}\n\n\ndef _label(name):\n    \"\"\"A member named after a table names it; anything else is unrouted.\"\"\"\n    stem = Path(name).stem.lower()\n    if stem.endswith(\".csv\") or stem.endswith(\".json\"):   # spells.csv.gz\n        stem = Path(stem).stem.lower()\n    return stem if stem in _KNOWN_STEMS else \"\"\n\n\ndef _as_text(name, data):\n    # utf-8-sig first: it strips Excel's byte order mark, and is identical to\n    # utf-8 when there is not one. Left in, the mark becomes part of the first\n    # column's name and every lookup for that column quietly misses.\n    try:\n        return data.decode(\"utf-8-sig\")\n    except UnicodeDecodeError:\n        pass\n    if data[:2] in (b\"\\xff\\xfe\", b\"\\xfe\\xff\"):\n        return data.decode(\"utf-16\")\n\n    # latin-1 cannot fail - every byte is a character in it - so an image would\n    # decode cleanly and then be parsed as a one-column CSV. Rule out binary\n    # before using it as the fallback rather than after.\n    if _looks_binary(data):\n        raise UnknownFormat(\n            f\"'{name}' is not a format this app reads. \"\n            f\"Accepted: {describe_formats()}.\"\n        )\n    return data.decode(\"latin-1\")\n\n\ndef _looks_binary(data):\n    sample = data[:8192]\n    if b\"\\x00\" in sample:\n        return True\n    printable = sum(byte >= 32 or byte in b\"\\t\\r\\n\" for byte in sample)\n    return printable < len(sample) * 0.9\n\n\ndef _from_sqlite(data):\n    # sqlite3 needs a real file; the upload is bytes in memory.\n    handle = tempfile.NamedTemporaryFile(suffix=\".db\", delete=False)\n    handle.write(data)\n    handle.close()\n    with sqlite3.connect(handle.name) as conn:\n        names = [\n            row[0] for row in\n            conn.execute(\"SELECT name FROM sqlite_master WHERE type='table'\")\n        ]\n        return {name: pd.read_sql(f'SELECT * FROM \"{name}\"', conn) for name in names}\n\n\ndef _from_zip(data):\n    tables = {}\n    with zipfile.ZipFile(io.BytesIO(data)) as archive:\n        for info in archive.infolist():\n            member = info.filename\n            # macOS puts a __MACOSX/._name resource fork beside every file.\n            # It is not data, and decoding it produces a confusing error.\n            if (info.is_dir() or member.startswith(\"__MACOSX/\")\n                    or Path(member).name.startswith(\"._\")\n                    or not member.lower().endswith(_ARCHIVE_SUFFIXES)):\n                continue\n            for label, frame in decode(member, archive.read(info)).items():\n                tables[label or Path(member).stem.lower()] = frame\n    if not tables:\n        raise UnknownFormat(\n            \"That archive holds nothing this app can read. Put the tables in \"\n            \"it as .csv, .json or .parquet.\"\n        )\n    return tables\n\n\ndef _from_json(name, text):\n    payload = json.loads(text)\n    if isinstance(payload, dict):\n        # {\"spells\": [...], \"transfers\": [...]} - every table in one file.\n        return {str(key): pd.DataFrame(value) for key, value in payload.items()}\n    return {_label(name): pd.DataFrame(payload)}\n\n\ndef _from_delimited(name, text):\n    \"\"\"A CSV, but the separator is whatever the exporting tool felt like.\"\"\"\n    sample = text[:8192]\n    try:\n        dialect = csv.Sniffer().sniff(sample, delimiters=\",;\\t|\")\n        sep = dialect.delimiter\n    except csv.Error:\n        # One column and no delimiter in sight is a legitimate table.\n        sep = \",\"\n    frame = pd.read_csv(io.StringIO(text), sep=sep)\n    if frame.empty and not len(frame.columns):\n        raise UnknownFormat(f\"'{name}' has no columns to read.\")\n    return frame\n",
 "scout/store/source.py": "\"\"\"Turn uploaded files into the tables the app reads.\n\nThe published page carries no dataset at all: the reader brings their own\nfile and it is parsed in their browser, never sent anywhere. That keeps the\nsite to software only - see docs/PUBLISHING.md for why that distinction\nmatters.\n\nBecause the data has to come from the reader, getting it in has to be easy.\nThree things are done to that end, none of which costs a dependency:\n\n  decoding   scout/store/formats.py reads databases, CSVs whatever the\n             delimiter, JSON, Parquet and zips of any of those\n  headers    \"Player Name\", \"BUY-FEE\" and \"player\" all reach player_name\n  routing    a file is matched to a table by its columns when its name says\n             nothing useful, so \"export (3).csv\" still lands correctly\n\nValidation stays deliberately loud. A silently half-loaded table shows an\nempty chart, and an empty chart reads as \"no such deals\" rather than \"wrong\nfile\".\n\"\"\"\nimport re\nfrom pathlib import Path\n\nimport pandas as pd\n\nfrom scout.store.formats import SUFFIXES, UnknownFormat, decode, describe_formats\n\n# What the app actually reads. Extra columns are always fine - a newer\n# pipeline adds them and an older page should still open the file.\nREQUIRED_COLUMNS = {\n    \"spells\": [\n        \"spell_id\", \"player_name\", \"club_name\", \"league\",\n        \"buy_season\", \"sell_season\", \"buy_fee\", \"sell_fee\", \"sell_type\",\n        \"is_realized\", \"profit\", \"roi_mult\", \"buy_age\", \"sell_age\",\n        \"age_diff\", \"hold_years\", \"buy_market_value\", \"sell_market_value\",\n        \"buy_value_gap\", \"sell_value_gap\",\n    ],\n    \"transfers\": [\"player_name\", \"fee_eur\", \"mv_at_time_eur\", \"age\"],\n}\n\n# Present only after the performance pipeline has run. The transfer half of\n# the app works without it, so its absence is a state, not an error.\nOPTIONAL_TABLES = [\"spell_performance\"]\n\nALL_TABLES = list(REQUIRED_COLUMNS) + OPTIONAL_TABLES\n\n# What a spreadsheet, a notebook or a hand-kept sheet calls the same thing.\n# Only unambiguous ones: guessing wrong is worse than asking for a rename.\nCOLUMN_ALIASES = {\n    \"player\": \"player_name\",\n    \"name\": \"player_name\",\n    \"footballer\": \"player_name\",\n    \"club\": \"club_name\",\n    \"team\": \"club_name\",\n    \"team_name\": \"club_name\",\n    \"competition\": \"league\",\n    \"league_code\": \"league\",\n    \"fee\": \"fee_eur\",\n    \"transfer_fee\": \"fee_eur\",\n    \"fee_euros\": \"fee_eur\",\n    \"market_value\": \"mv_at_time_eur\",\n    \"mv\": \"mv_at_time_eur\",\n    \"mv_eur\": \"mv_at_time_eur\",\n    \"minutes\": \"tm_minutes\",\n    \"goals\": \"tm_goals\",\n    \"assists\": \"tm_assists\",\n    \"apps\": \"tm_apps\",\n    \"appearances\": \"tm_apps\",\n    \"xg\": \"fb_xg\",\n    \"npxg\": \"fb_npxg\",\n}\n\n# How a frame is recognised when its filename says nothing. Ordered: the\n# performance table carries every spells column plus the totals, so it has to\n# be tested before spells or everything would route to spells.\n_SIGNATURES = [\n    (\"spell_performance\", {\"spell_id\"}, {\"tm_minutes\", \"tm_apps\", \"has_perf_data\"}),\n    (\"spells\", {\"spell_id\"}, {\"buy_fee\", \"sell_type\", \"roi_mult\"}),\n    (\"transfers\", {\"fee_eur\"}, set()),\n]\n\n\nclass UploadError(Exception):\n    \"\"\"Something about the uploaded file stops the app from using it.\"\"\"\n\n\ndef validate(frame, table):\n    \"\"\"Required columns the frame does not have, in declaration order.\"\"\"\n    return [c for c in REQUIRED_COLUMNS.get(table, []) if c not in frame.columns]\n\n\ndef describe_schema(table):\n    return \", \".join(REQUIRED_COLUMNS.get(table, []))\n\n\ndef describe_accepted():\n    return describe_formats()\n\n\ndef read_upload(sources):\n    \"\"\"Load the app's tables out of one upload or several.\n\n    Accepts a path, an object with .read(), a (filename, bytes) pair, or a\n    list of any of those - Streamlit hands over a list once the uploader takes\n    more than one file.\n    \"\"\"\n    found = _decode_all(sources)\n    tables = _route(found)\n\n    missing = [name for name in REQUIRED_COLUMNS if name not in tables]\n    if missing:\n        raise UploadError(\n            \"Could not find the table(s): \" + \", \".join(missing) + \". \"\n            + _what_was_found(found)\n        )\n\n    for name in REQUIRED_COLUMNS:\n        gaps = validate(tables[name], name)\n        if gaps:\n            raise UploadError(\n                f\"Table '{name}' is missing the column(s): \" + \", \".join(gaps)\n            )\n\n    if tables[\"spells\"].empty:\n        raise UploadError(\n            \"The 'spells' table is empty, so there is nothing to show. Run the \"\n            \"pipeline before exporting the database.\"\n        )\n    return tables\n\n\ndef _decode_all(sources):\n    \"\"\"[(label, frame)] from every upload, headers already normalised.\"\"\"\n    found = []\n    for name, data in (_as_name_and_bytes(s) for s in _as_list(sources)):\n        try:\n            decoded = decode(name, data)\n        except UnknownFormat as error:\n            raise UploadError(str(error)) from error\n        except Exception as error:\n            # pandas and sqlite3 raise a wide range of things on a malformed\n            # file. The user needs a sentence, not the class name.\n            raise UploadError(f\"Could not read '{name}': {error}\") from error\n        for label, frame in decoded.items():\n            found.append((label, normalise_columns(frame)))\n    return found\n\n\ndef _as_list(sources):\n    if isinstance(sources, (list, tuple)) and not _is_pair(sources):\n        return list(sources)\n    return [sources]\n\n\ndef _is_pair(value):\n    return (len(value) == 2 and isinstance(value[0], str)\n            and isinstance(value[1], (bytes, bytearray)))\n\n\ndef _as_name_and_bytes(source):\n    if isinstance(source, (list, tuple)) and _is_pair(source):\n        return source[0], bytes(source[1])\n    if hasattr(source, \"read\"):\n        # Streamlit's uploaded file knows its own name; a bare buffer does not,\n        # and then routing falls back to the columns.\n        return getattr(source, \"name\", \"\"), source.read()\n    path = Path(source)\n    return path.name, path.read_bytes()\n\n\ndef canonical_column(name):\n    \"\"\"Header text as written -> the name the app uses.\"\"\"\n    key = re.sub(r\"[\\s\\-]+\", \"_\", str(name).strip().lower())\n    key = re.sub(r\"_{2,}\", \"_\", key)\n    return COLUMN_ALIASES.get(key, key)\n\n\ndef normalise_columns(frame):\n    \"\"\"Rename headers to the app's vocabulary, without losing an exact match.\n\n    A file carrying both `player` and `player_name` meant the latter; letting\n    the alias overwrite it would silently swap real values for guessed ones.\n    \"\"\"\n    exact = set(frame.columns)\n    renames = {}\n    for column in frame.columns:\n        target = canonical_column(column)\n        if target != column and target not in exact and target not in renames.values():\n            renames[column] = target\n    return frame.rename(columns=renames) if renames else frame\n\n\ndef route(frame):\n    \"\"\"Which table this frame is, judged on its columns. None if unclear.\"\"\"\n    columns = set(frame.columns)\n    for name, required, markers in _SIGNATURES:\n        if required <= columns and (not markers or markers & columns):\n            return name\n    return None\n\n\ndef _route(found):\n    \"\"\"Labelled frames win; the rest are matched on their columns.\"\"\"\n    tables = {}\n    unlabelled = []\n    for label, frame in found:\n        if label in ALL_TABLES:\n            tables[label] = frame\n        else:\n            unlabelled.append(frame)\n\n    for frame in unlabelled:\n        name = route(frame)\n        # A filename that already named the table is the stronger signal, so\n        # column routing never overwrites it.\n        if name and name not in tables:\n            tables[name] = frame\n    return tables\n\n\ndef _what_was_found(found):\n    if not found:\n        return \"Nothing readable was uploaded.\"\n    parts = []\n    for label, frame in found:\n        columns = \", \".join(map(str, list(frame.columns)[:6]))\n        parts.append(f\"{label or 'unnamed'} ({columns}…)\")\n    return \"What arrived: \" + \"; \".join(parts) + \".\"\n"
};

mount(
  {
    requirements: [],
    entrypoint: "app.py",
    files: FILES,
    streamlitConfig: { "client.toolbarMode": "minimal" },
  },
  document.getElementById("root"),
);
</script>
